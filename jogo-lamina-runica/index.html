<!doctype html>
<html lang="pt-BR" class="standalone">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ARTIFACT-START -->
<title>Lâmina Rúnica</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#141225">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: uma coluna de jogo — barra de recursos, cena de batalha (maior), barra de poderes e painel de abas recolhível */
:root {
  --ink: #141225;
  --panel: #1d1a33;
  --panel-2: #27224a;
  --line: #3b3466;
  --text: #f4effd;
  --muted: #a99fcf;
  --gold: #ffc94a;
  --gold-deep: #c9871c;
  --mana: #55c8ff;
  --hp: #ff5d6c;
  --ok: #7ee08a;
  --essence: #c58bff;
  --danger: #ff6b5a;
  --f-display: 'Bungee', 'Impact', 'Arial Black', system-ui, sans-serif;
  --f-body: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--ink); color: var(--text);
  font-family: var(--f-body); font-size: 14px;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
.standalone body { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

#app { height: 100%; max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; position: relative; background: var(--ink); }

/* ---------- barra superior ---------- */
#top { display: flex; align-items: center; gap: 10px; padding-block: 6px; background: var(--panel); border-bottom: 1px solid var(--line); }
.res { display: flex; align-items: center; gap: 6px; font-family: var(--f-display); font-size: 17px; font-variant-numeric: tabular-nums; min-width: 0; }
.res svg { flex: 0 0 auto; width: 22px; height: 22px; }
.res.gold { color: var(--gold); flex: 1 1 0; }
.res.ess { color: var(--essence); font-size: 15px; }
.stageBox { flex: 1 1 0; text-align: center; min-width: 0; }
.stageBox .zone { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stageBox .stage { font-family: var(--f-display); font-size: 15px; }
.pips { display: flex; justify-content: center; gap: 3px; margin-top: 3px; }
.pips i { width: 8px; height: 4px; border-radius: 2px; background: var(--line); }
.pips i.on { background: var(--gold); }
.pips i.boss { width: 12px; background: #5a2a3a; }
.pips i.boss.on { background: var(--hp); }
.iconBtn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); display: grid; place-items: center; flex: 0 0 auto; padding: 0; }
.iconBtn svg { width: 20px; height: 20px; }

/* ---------- cena ---------- */
#scene { position: relative; flex: 1 1 auto; min-height: 240px; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
#foe { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: min(78%, 380px); pointer-events: none; text-align: center; }
.foeName { font-family: var(--f-display); font-size: 14px; text-shadow: 0 2px 0 rgba(0,0,0,.5); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.foeName.boss { color: #ffb0b8; }
.bar { position: relative; height: 16px; border-radius: 8px; background: rgba(10,8,25,.75); border: 1px solid rgba(255,255,255,.18); overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; width: 100%; border-radius: 8px; }
.bar.hp > i { background: linear-gradient(180deg, #ff8a95, var(--hp)); transition: width .08s linear; }
.bar > span { position: relative; display: block; font-size: 11px; font-weight: 900; line-height: 14px; text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; }
.bar.timer { height: 8px; margin-top: 4px; }
.bar.timer > i { background: linear-gradient(90deg, var(--danger), var(--gold)); }
#dpsTag { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); bottom: 8px; font-size: 11px; font-weight: 800; color: var(--muted); background: rgba(10,8,25,.6); padding: 4px 8px; border-radius: 8px; pointer-events: none; font-variant-numeric: tabular-nums; max-width: 62%; }
#dpsTag b { color: var(--text); }
#btnBoss { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); bottom: 8px; border: 0; border-radius: 12px; padding: 9px 14px; background: linear-gradient(180deg, #ff7d88, #c9334a); font-family: var(--f-display); font-size: 13px; box-shadow: 0 4px 0 #7a1d2c; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }
#saveDot { position: absolute; top: 10px; right: max(10px, env(safe-area-inset-right, 0px)); font-size: 10px; font-weight: 800; color: var(--ok); opacity: 0; transition: opacity .4s; pointer-events: none; }
#saveDot.show { opacity: .9; }

/* ---------- poderes ---------- */
#skillbar { background: var(--panel); border-top: 1px solid var(--line); padding-block: 6px; display: flex; flex-direction: column; gap: 5px; }
.mana { position: relative; height: 10px; border-radius: 5px; background: #0e0c20; overflow: hidden; }
.mana > i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #2a7fd6, var(--mana)); }
.mana > span { position: absolute; inset: 0; font-size: 9px; font-weight: 900; text-align: center; line-height: 10px; text-shadow: 0 1px 1px #000; }
.skills { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.skill { position: relative; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 0; }
.skill svg { width: 22px; height: 22px; position: relative; z-index: 1; }
.skill small { position: relative; z-index: 1; font-size: 10px; font-weight: 900; color: var(--mana); }
.skill .cd { position: absolute; inset: 0; background: conic-gradient(rgba(5,4,15,.78) calc(var(--p, 0) * 1turn), transparent 0); }
.skill .cdTxt { position: absolute; z-index: 2; font-family: var(--f-display); font-size: 15px; text-shadow: 0 1px 3px #000; }
.skill.active { border-color: var(--gold); box-shadow: inset 0 0 14px rgba(255,201,74,.45); }
.skill.locked { opacity: .35; }
.skill.nomana small { color: var(--danger); }

/* ---------- painel ---------- */
#panel { flex: 0 0 36%; min-height: 0; display: flex; flex-direction: column; background: var(--panel); border-top: 1px solid var(--line); }
#panel.collapsed { flex: 0 0 auto; }
#panel.collapsed #qty, #panel.collapsed #list { display: none; }
#tabs { display: grid; grid-template-columns: repeat(5, 1fr) 40px; border-bottom: 1px solid var(--line); }
#tabs button { position: relative; border: 0; background: none; padding: 8px 2px 6px; font-size: 11px; font-weight: 800; color: var(--muted); border-bottom: 3px solid transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; }
#tabs button svg { width: 18px; height: 18px; }
#tabs button.on { color: var(--gold); border-bottom-color: var(--gold); }
#tabs button.has::after { content: ""; position: absolute; top: 5px; right: calc(50% - 16px); width: 8px; height: 8px; border-radius: 50%; background: var(--hp); box-shadow: 0 0 0 2px var(--panel); }
#tabs #panelToggle { justify-content: center; }
#panelToggle svg { transition: transform .2s; }
#panel.collapsed #panelToggle svg { transform: rotate(180deg); }
#qty { display: flex; gap: 6px; justify-content: flex-end; padding-block: 6px; }
#qty button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 3px 10px; font-size: 12px; font-weight: 900; color: var(--muted); }
#qty button.on { background: var(--gold); color: #3a2400; border-color: var(--gold); }
#list { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 12px; display: flex; flex-direction: column; gap: 8px; padding-top: 6px; }
.row { display: flex; align-items: center; gap: 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
.row.locked { opacity: .45; }
.row.best { border-color: var(--ok); }
.av { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-family: var(--f-display); font-size: 18px; color: #160f2a; overflow: hidden; }
.av svg { width: 24px; height: 24px; }
.av img { width: 44px; height: 44px; display: block; }
.info { flex: 1 1 auto; min-width: 0; }
.info .t { font-weight: 900; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.info .t em { font-style: normal; color: var(--gold); font-variant-numeric: tabular-nums; }
.info .s { font-size: 12px; color: var(--muted); line-height: 1.3; }
.info .s b { color: var(--text); font-variant-numeric: tabular-nums; }
.chip { display: inline-block; font-size: 10px; font-weight: 900; color: #0f2a14; background: var(--ok); border-radius: 6px; padding: 1px 5px; margin-left: 4px; vertical-align: 1px; }
.stars { color: var(--gold); letter-spacing: 1px; }
.buy { flex: 0 0 auto; min-width: 92px; border: 0; border-radius: 10px; padding: 6px 8px; background: linear-gradient(180deg, #ffd977, var(--gold)); color: #3a2400; box-shadow: 0 3px 0 var(--gold-deep); display: flex; flex-direction: column; align-items: center; line-height: 1.15; touch-action: manipulation; }
.buy .a { font-size: 11px; font-weight: 900; }
.buy .b { font-family: var(--f-display); font-size: 13px; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 3px; }
.buy .b svg { width: 13px; height: 13px; }
.buy.ess { background: linear-gradient(180deg, #dcb2ff, var(--essence)); color: #2a0f45; box-shadow: 0 3px 0 #7a46a8; }
.buy:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--gold-deep); }
.buy[disabled] { background: #3a355c; color: #8a83ad; box-shadow: 0 3px 0 #23203d; cursor: default; }
.card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.card h3 { margin: 0 0 4px; font-family: var(--f-display); font-weight: 400; font-size: 15px; color: var(--essence); }
.card h3.gold { color: var(--gold); }
.card p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.4; }
.card .btns { margin-top: 8px; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; }
.days span { text-align: center; font-size: 10px; font-weight: 900; padding: 5px 0; border-radius: 6px; background: var(--ink); color: var(--muted); }
.days span.done { background: var(--gold-deep); color: #2a1800; }
.days span.today { outline: 2px solid var(--gold); color: var(--gold); }
.stats { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 13px; margin: 0; }
.stats dt { color: var(--muted); }
.stats dd { margin: 0; font-weight: 900; text-align: right; font-variant-numeric: tabular-nums; }
.sectionLabel { font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }

/* ---------- avisos e janelas ---------- */
#toasts { position: absolute; left: 0; right: 0; top: 150px; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 30; }
.toast { background: rgba(20,18,37,.94); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; font-weight: 800; font-size: 13px; max-width: 90%; text-align: center; animation: toastIn .25s ease-out; }
.toast.gold { border-color: var(--gold); color: var(--gold); }
.toast.bad { border-color: var(--danger); color: #ffc0b8; }
@keyframes toastIn { from { transform: translateY(-8px); opacity: 0; } }
#modal { position: absolute; inset: 0; z-index: 40; background: rgba(6,5,16,.72); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-height: 88%; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 18px 18px 0 0; padding-block: 16px 22px; display: flex; flex-direction: column; gap: 12px; }
.sheet h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 20px; text-wrap: balance; }
.sheet p { margin: 0; color: var(--muted); line-height: 1.45; }
.sheet .big { font-family: var(--f-display); font-size: 26px; color: var(--gold); }
.setRow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.setRow label { font-weight: 800; }
.setRow small { display: block; color: var(--muted); font-weight: 600; font-size: 11px; }
.switch { appearance: none; -webkit-appearance: none; width: 46px; height: 26px; border-radius: 13px; background: var(--line); position: relative; flex: 0 0 auto; cursor: pointer; transition: background .15s; margin: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--text); transition: transform .15s; }
.switch:checked { background: var(--ok); }
.switch:checked::after { transform: translateX(20px); }
select, input[type=range] { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; font-weight: 700; }
input[type=range] { padding: 0; width: 130px; accent-color: var(--gold); }
textarea { width: 100%; min-height: 84px; background: #0e0c20; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; resize: vertical; user-select: text; -webkit-user-select: text; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 9px 14px; font-weight: 900; }
.btn.primary { background: var(--gold); color: #3a2400; border-color: var(--gold); }
.btn.purple { background: var(--essence); color: #2a0f45; border-color: var(--essence); }
.btn.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: #2a0806; }
.btn[disabled] { opacity: .45; cursor: default; }
.fileLbl { position: relative; overflow: hidden; }
.fileLbl input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.muted { color: var(--muted); font-size: 12px; }
.cloudOn { color: var(--ok); font-weight: 900; }

@media (prefers-reduced-motion: reduce) {
  #btnBoss { animation: none; }
  .toast { animation: none; }
}
</style>
</head>
<body>
<div id="app">
  <header id="top" class="gutter">
    <div class="res gold" aria-label="Ouro">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#ffc94a"/><circle cx="12" cy="12" r="7" fill="none" stroke="#c9871c" stroke-width="2"/><path d="M12 8v8M9.5 10.5h5" stroke="#c9871c" stroke-width="2" stroke-linecap="round"/></svg>
      <b id="goldTxt">0</b>
    </div>
    <div class="stageBox">
      <div class="zone" id="zoneTxt">Campos de Âmbar</div>
      <div class="stage">Estágio <span id="stageTxt">1</span></div>
      <div class="pips" id="pips"></div>
    </div>
    <div class="res ess" aria-label="Essências">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l7 7-7 13L5 9z" fill="#c58bff"/><path d="M5 9h14M12 2l-3 7 3 13 3-13z" fill="none" stroke="#7a46a8" stroke-width="1.4" stroke-linejoin="round"/></svg>
      <b id="essTxt">0</b>
    </div>
    <button class="iconBtn" id="btnSettings" aria-label="Configurações">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main id="scene">
    <canvas id="cv" aria-label="Campo de batalha: toque no monstro para atacar"></canvas>
    <div id="foe">
      <div class="foeName" id="foeName">—</div>
      <div class="bar hp"><i id="hpFill"></i><span id="hpTxt">0</span></div>
      <div class="bar timer" id="timerBar" hidden><i id="timerFill"></i></div>
    </div>
    <div id="dpsTag">DPS <b id="dpsTxt">0</b> · Toque <b id="tapTxt">1</b></div>
    <button id="btnBoss" hidden>Desafiar chefe</button>
    <div id="saveDot">✓ salvo</div>
  </main>

  <section id="skillbar" class="gutter">
    <div class="mana"><i id="manaFill"></i><span id="manaTxt">0 / 100</span></div>
    <div class="skills" id="skills"></div>
  </section>

  <section id="panel">
    <nav id="tabs" class="gutter" aria-label="Menu"></nav>
    <div id="qty" class="gutter"></div>
    <div id="list" class="gutter"></div>
  </section>

  <div id="toasts"></div>
  <div id="modal" hidden><div class="sheet gutter" id="sheet" role="dialog" aria-modal="true"></div></div>
</div>

<script>
(() => {
'use strict';

/* =========================================================
   CONSTANTES E DADOS
   ========================================================= */
const SAVE_KEY = 'laminaRunica.save.v1';
const BACKUP_KEY = 'laminaRunica.backup.v1';
const VERSION = 2;
const WAVES = 10;
const OFFLINE_CAP = 12 * 3600;       // máximo de 12 h de progresso offline
const PRESTIGE_STAGE = 40;
const ACTIVE_WINDOW = 90 * 1000;     // sem tocar por 90 s = jogador ausente (AFK)
const ALLY_SHOWN = 6;                // quantos aliados aparecem na cena

const ALLIES = [
  { name: 'Brisa',    cost: 50,     dps: 5      },
  { name: 'Tork',     cost: 250,    dps: 22     },
  { name: 'Lumi',     cost: 1e3,    dps: 74     },
  { name: 'Gragh',    cost: 4e3,    dps: 245    },
  { name: 'Selene',   cost: 2e4,    dps: 976    },
  { name: 'Pip',      cost: 1e5,    dps: 3725   },
  { name: 'Orvan',    cost: 4e5,    dps: 10859  },
  { name: 'Yara',     cost: 2.5e6,  dps: 47143  },
  { name: 'Kaz',      cost: 1.5e7,  dps: 1.86e5 },
  { name: 'Morwen',   cost: 1e8,    dps: 7.82e5 },
  { name: 'Ignis',    cost: 1e9,    dps: 3.72e6 },
  { name: 'Aurea',    cost: 1e10,   dps: 1.49e7 },
  { name: 'Vex',      cost: 1e11,   dps: 5.11e7 },
  { name: 'Thalassa', cost: 1e12,   dps: 2.1e8  },
  { name: 'Ossian',   cost: 1.5e13, dps: 9.4e8  },
  { name: 'Nyx',      cost: 2.5e14, dps: 4.6e9  },
];

const SPECIES = ['Fênix', 'Grifo', 'Dragão Filhote', 'Raposa Espiritual', 'Unicórnio', 'Coruja Arcana', 'Tartaruga Ancestral', 'Lobo Lunar', 'Serpente Alada', 'Cervo Estelar'];

function randomForms() {
  const out = [];
  let bag = [];
  for (let i = 0; i < ALLIES.length; i++) {
    if (!bag.length) bag = SPECIES.map((_, k) => k).sort(() => Math.random() - 0.5);
    out.push({ sp: bag.pop(), hue: Math.floor(Math.random() * 360) });
  }
  return out;
}

const SKILLS = [
  { id: 'raio',  name: 'Raio Celeste',      unlock: 10, base: 100, mana: 25, cd: 6,  dur: () => 0,
    desc: l => `Um raio causa ${fmtPlain(skillPower(0, Math.max(1, l)))}× o seu dano de toque.` },
  { id: 'furia', name: 'Fúria das Lâminas', unlock: 25, base: 2e3, mana: 45, cd: 45, dur: l => 12 + 3 * l,
    desc: l => `Ataca sozinho 10 vezes por segundo durante ${12 + 3 * Math.max(1, l)} s.` },
  { id: 'ouro',  name: 'Chuva de Ouro',     unlock: 50, base: 5e4, mana: 40, cd: 60, dur: () => 30,
    desc: l => `Monstros soltam ${fmtPlain(skillPower(2, Math.max(1, l)))}× mais ouro por 30 s.` },
  { id: 'grito', name: 'Grito de Guerra',   unlock: 80, base: 1e6, mana: 40, cd: 60, dur: () => 30,
    desc: l => `Aliados causam ${fmtPlain(skillPower(3, Math.max(1, l)))}× mais dano por 30 s.` },
];
const SKILL_MAX = 15;

function merge(def, src) {
  if (src === undefined || src === null) return def;
  if (Array.isArray(def)) {
    if (!Array.isArray(src)) return def;
    return def.map((d, i) => (i < src.length ? merge(d, src[i]) : d));
  }
  if (typeof def === 'object' && def !== null) {
    if (typeof src !== 'object' || Array.isArray(src)) return def;
    const out = { ...def };
    const open = Object.keys(def).length === 0;   // objeto livre (artefatos, conquistas)
    for (const k of Object.keys(src)) {
      if (k in def) out[k] = merge(def[k], src[k]);
      else if (open && typeof src[k] === 'number' && isFinite(src[k])) out[k] = src[k];
    }
    return out;
  }
  if (typeof def === 'number') return (typeof src === 'number' && isFinite(src)) ? src : def;
  if (typeof src !== typeof def) return def;
  return src;
}

function migrate(raw) {
  if (!raw.v || raw.v < 2) {
    // v1 somava o tempo offline ao tempo de jogo; o contador antigo é descartado.
    if (raw.stats) delete raw.stats.time;
  }
  raw.v = VERSION;
  return raw;
}

function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36);
}

function storeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function storeSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function storeDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

function parseSave(text) {
  if (!text) return null;
  try {
    const wrap = JSON.parse(text);
    if (!wrap || typeof wrap.data !== 'string') return null;
    if (wrap.h && wrap.h !== hash(wrap.data)) return null;      // salvamento corrompido
    return merge(defaults(), migrate(JSON.parse(wrap.data)));
  } catch (e) { return null; }
}
function serialize() {
  const data = JSON.stringify(S);
  return JSON.stringify({ h: hash(data), data });
}

let S = defaults();
let lastSaveAt = 0;
let storageOk = true;

function save(manual) {
  S.lastSave = Date.now();
  const prev = storeGet(SAVE_KEY);
  if (prev) storeSet(BACKUP_KEY, prev);
  storageOk = storeSet(SAVE_KEY, serialize());
  lastSaveAt = performance.now();
  if (storageOk) {
    const d = $('#saveDot'); d.classList.add('show');
    clearTimeout(save._t); save._t = setTimeout(() => d.classList.remove('show'), 900);
  }
  if (manual) {
    cloudSave();
    toast(storageOk ? 'Jogo salvo.' : 'Não foi possível salvar neste navegador (armazenamento bloqueado).', storageOk ? '' : 'bad');
  }
}
let dirtyTimer = null;
function saveSoon() { clearTimeout(dirtyTimer); dirtyTimer = setTimeout(() => save(), 1500); }

function loadSave() {
  let s = parseSave(storeGet(SAVE_KEY));
  if (!s) {
    s = parseSave(storeGet(BACKUP_KEY));
    if (s) setTimeout(() => toast('O salvamento principal falhou; o backup foi carregado.', 'bad'), 600);
  }
  return s;
}

function exportCode() {
  const json = JSON.stringify(S);
  return 'LR1.' + btoa(unescape(encodeURIComponent(json))) + '.' + hash(json);
}
function importCode(code) {
  code = (code || '').trim();
  const m = /^LR1\.([A-Za-z0-9+/=]+)\.([a-z0-9]+)$/.exec(code);
  if (!m) return null;
  try {
    const json = decodeURIComponent(escape(atob(m[1])));
    if (hash(json) !== m[2]) return null;
    return merge(defaults(), migrate(JSON.parse(json)));
  } catch (e) { return null; }
}

/* ---------- salvamento na nuvem (quando a página roda no claude.ai com login) ---------- */
const cloud = { ref: null, ok: false, busy: false, at: 0, last: 0 };
const wait = ms => new Promise(r => setTimeout(() => r(null), ms));
async function cloudInit() {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    cloud.ref = db.doc('data/users/' + id + '/save');
    const snap = await Promise.race([cloud.ref.get(), wait(10000)]);
    if (!snap) return;
    cloud.ok = true;
    if (snap.exists) {
      const d = snap.data() || {};
      const s = parseSave(typeof d.save === 'string' ? d.save : '');
      if (s && s.lastSave > S.lastSave + 5000) {
        const away = (Date.now() - s.lastSave) / 1000;
        applyState(s);
        offlineGains(away, false);
        toast('Progresso da nuvem carregado.', 'gold');
      }
    }
    cloudSave();
  } catch (e) { cloud.ok = false; }
}
async function cloudSave() {
  if (!cloud.ok || cloud.busy) return;
  cloud.busy = true;
  cloud.last = performance.now();
  try {
    await cloud.ref.set({ save: serialize(), at: Date.now() });
    cloud.at = Date.now();
  } catch (e) {
    if (e && (e.code === 'invalid_argument' || e.code === 'permission_denied' || e.code === 'not_granted')) cloud.ok = false;
  }
  cloud.busy = false;
}

const $ = s => document.querySelector(s);

function rng(seed) {

}
const SUF = ['', 'K', 'M', 'B', 'T'];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 0) return '-' + fmt(-n);
  if (n < 1000) return (n < 100 && n % 1 > 0.05) ? n.toFixed(1).replace('.', ',') : String(Math.floor(n));
  if (S.settings.notation === 'sci') return n.toExponential(2).replace('+', '').replace('.', ',');
  const e = Math.floor(Math.log10(n) / 3);
  const v = n / Math.pow(1000, e);
  let suf;
  if (e < SUF.length) suf = SUF[e];
  else { const i = e - SUF.length; suf = String.fromCharCode(97 + Math.floor(i / 26) % 26) + String.fromCharCode(97 + i % 26); }
  const num = v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : String(Math.floor(v));
  return num.replace('.', ',') + suf;
}
function fmtPlain(n) { return n < 1000 ? String(+n.toFixed(1)).replace('.', ',') : fmt(n); }
function fmtTime(sec) {
  sec = Math.floor(sec);
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  if (d) return `${d} d ${h} h`;
  if (h) return `${h} h ${m} min`;
  if (m) return `${m} min ${s} s`;
  return `${s} s`;
}
function costN(c0, g, lvl, n) { return c0 * Math.pow(g, lvl) * (Math.pow(g, n) - 1) / (g - 1); }
function maxN(c0, g, lvl, gold) {
  const first = c0 * Math.pow(g, lvl);
  if (gold < first) return 0;
  let n = Math.floor(Math.log(gold * (g - 1) / first + 1) / Math.log(g));
  while (n > 0 && costN(c0, g, lvl, n) > gold) n--;
  return n;
}

function dmgMult() { return (1 + 0.1 * S.essTotal) * (1 + 0.5 * art('elmo')); }

  let m = 1 + 0.3 * art('bolsa');
  if (skillActive(2)) m *= skillPower(2, S.skills[2].lvl);

}
function allyMult(l) { return l <= 0 ? 0 : (l >= 10 ? 2 : 1) * Math.pow(4, Math.floor(l / 25)); }
function allyDps(i, l = S.allies[i]) { return ALLIES[i].dps * l * allyMult(l); }
function baseDps() { let t = 0; for (let i = 0; i < ALLIES.length; i++) t += allyDps(i); return t; }
function allyFactor() { return dmgMult() * (1 + 0.6 * art('tambor')); }
function dps(withSkill = true) {
  let d = baseDps() * allyFactor();
  if (withSkill && skillActive(3)) d *= skillPower(3, S.skills[3].lvl);
  return d;
}
function heroMult(l) { return Math.pow(1.75, Math.floor(l / 10)); }
function heroBase(l = S.hero) { return l * heroMult(l); }
function comboMult() { return 1 + Math.min(combo.n, 100) * 0.004; }

function critChance() { return Math.min(0.6, 0.03 + 0.015 * art('olho')); }

function manaMax() { return 100 + 15 * art('calice'); }

let AC = null, master = null, lastHitSfx = 0;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume().catch(() => {}); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();

function tone(freq, dur, type = 'square', vol = 0.15, slide = 0, delay = 0) {
  if (!AC || !S.settings.sound) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
  g.gain.setValueAtTime(vol * S.settings.volume, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
}
let noiseBuf = null;
function noise(dur, vol, freq = 1800) {
  if (!AC || !S.settings.sound) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.4, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime;
  const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
  g.gain.setValueAtTime(vol * S.settings.volume, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t + dur + 0.02);
}

function drawCreature(c, sp, hue, t) {
  const main = `hsl(${hue},70%,62%)`, dark = `hsl(${hue},55%,36%)`, light = `hsl(${hue},85%,84%)`, acc = `hsl(${(hue + 45) % 360},95%,62%)`;
  const flap = Math.sin(t * 9);
  const E = (x, y, rx, ry, r, f) => { c.fillStyle = f; c.beginPath(); c.ellipse(x, y, Math.abs(rx), Math.abs(ry), r || 0, 0, Math.PI * 2); c.fill(); };
  const eye = (x, y, r = 1.8) => { E(x, y, r, r, 0, '#fff'); E(x + r * 0.3, y, r * 0.55, r * 0.55, 0, '#1a1030'); };
  const poly = (pts, f) => { c.fillStyle = f; c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); c.fill(); };
  const legs = (xs, col, h = 5, w = 2.2) => { c.fillStyle = col; xs.forEach(x => c.fillRect(x - w / 2, 3, w, h)); };
  c.lineJoin = 'round'; c.lineCap = 'round';
  switch (sp) {
    case 0: { // Fênix
      for (let i = 0; i < 3; i++) { c.save(); c.rotate(0.3 * (i - 1) + Math.sin(t * 6 + i) * 0.15); E(-14, 0, 9, 2.6, 0, i === 1 ? '#ffd84a' : acc); c.restore(); }
      poly([[-2, -2], [-10, -12 - flap * 6], [4, -4]], dark);
      E(0, 0, 9, 6, 0, main);
      E(8, -5, 4.5, 4.5, 0, main);
      poly([[12, -6], [16, -4.5], [12, -3.5]], '#ffd84a');
      poly([[6, -9], [5, -14], [8, -9.5]], acc); poly([[8, -9], [9.5, -13], [10, -8.5]], acc);
      eye(9.5, -6, 1.5);
      poly([[-1, -1], [-8, -13 - flap * 7], [6, -2]], light);
      break;
    }
    case 1: { // Grifo
      c.strokeStyle = '#a77a3e'; c.lineWidth = 1.8; c.beginPath(); c.moveTo(-9, 2); c.quadraticCurveTo(-15, 2, -15, -4); c.stroke(); E(-15, -5, 2, 2, 0, '#7a5426');
      legs([-6, -3, 4, 7], '#a77a3e');
      E(0, 2, 10, 6, 0, '#d9a85c');
      poly([[-3, -1], [-9, -14 - flap * 6], [5, -2]], main);
      E(9, -4, 4.5, 4.5, 0, '#f4efe6');

/* =========================================================
   MONSTROS
   ========================================================= */
let foe = null;
let spawnDelay = 0;

function makeName(r, boss) {
  const n = NAME_A[Math.floor(r() * NAME_A.length)] + NAME_B[Math.floor(r() * NAME_B.length)];
  return boss ? `${n}, ${BOSS_T[Math.floor(r() * BOSS_T.length)]}` : n;
}

function spawn(forceBoss) {
  const boss = forceBoss || (S.wave >= WAVES - 1 && !S.bossFailed);
  const seed = (S.stage * 7919 + S.wave * 104729 + Math.floor(Math.random() * 1e6)) >>> 0;
  const r = rng(seed);
  const chest = !boss && S.stage >= 3 && Math.random() < 0.03;
  const zone = zoneOf(S.stage);
  let hp = hpFor(S.stage);
  if (boss) hp *= 6;
  if (chest) hp *= 0.6;
  foe = {
    boss, chest, seed, hp, maxHp: hp,
    name: chest ? 'Baú Vivo' : makeName(r, boss),
    hue: (zone.hue + (r() - 0.5) * 140 + 360) % 360,
    lobes: 3 + Math.floor(r() * 5), phase: r() * 6.28, amp: 0.05 + r() * 0.09,
    eyes: boss ? 2 + Math.floor(r() * 2) : 1 + Math.floor(r() * 3),
    horns: boss || r() < 0.55, hornLen: 0.35 + r() * 0.35, spikes: r() < 0.4, sat: 55 + r() * 30,
    born: 0, hit: 0, dead: false, deathT: 0, timer: boss ? bossTime() : 0,
  };
  if (boss) { SFX.boss(); vibrate(40); }
  updateFoeUI(true);
}

function killFoe() {
  const f = foe;
  f.dead = true; f.deathT = 0;
  let g = goldFor(S.stage) * goldMult();
  if (f.boss) g *= 6;
  if (f.chest) { g *= 12; S.stats.chests++; toast(`Baú Vivo derrotado! +${fmt(g)} de ouro`, 'gold'); }
  S.gold += g; S.stats.gold += g; S.stats.kills++;
  fx.coinBurst(f.boss || f.chest ? 14 : 5);
  fx.dieBurst();
  SFX.coin();
  if (f.boss) {
    S.stats.bosses++;
    S.stage++; S.wave = 0; S.bossFailed = false; S.farmKills = 0;
    if (S.stage > S.runMaxStage) S.runMaxStage = S.stage;
    if (S.stage > S.maxStage) S.maxStage = S.stage;
    SFX.win(); vibrate([20, 40, 20]); fx.shake(10);
    if ((S.stage - 1) % 10 === 0) toast(`Nova região: ${zoneOf(S.stage).name}`, 'gold');
    if (S.runMaxStage === PRESTIGE_STAGE) toast('Renascer liberado na aba Relíquias!', 'gold');
    saveSoon();
  } else if (S.bossFailed) {
    S.farmKills++;
    if (S.settings.autoBoss && S.farmKills >= WAVES) { S.bossFailed = false; S.farmKills = 0; S.wave = WAVES - 1; }
  } else {
    S.wave = Math.min(WAVES - 1, S.wave + 1);
  }
  spawnDelay = 0.4;
  uiDirty = true;
}

function bossEscaped() {
  S.bossFailed = true; S.wave = WAVES - 1; S.farmKills = 0;
  toast('O chefe escapou! Fortaleça-se e desafie de novo.', 'bad');
  SFX.fail(); vibrate(60);
  spawn(false);
}

function damage(amount, x, y, kind) {
  if (!foe || foe.dead || spawnDelay > 0) return;
  foe.hp -= amount;
  foe.hit = 0.12;
  if (kind && S.settings.dmgNums) fx.number(amount, x, y, kind);
  if (foe.hp <= 0) { foe.hp = 0; killFoe(); }
}

/* =========================================================
   ESPÍRITO ERRANTE (bônus voador)
   ========================================================= */
let wisp = null;
let nextWisp = 25 + Math.random() * 20;
function wispInterval() { return (45 + Math.random() * 45) / (1 + 0.1 * art('lanter')); }
function spawnWisp() {
  const fromLeft = Math.random() < 0.5;
  wisp = { x: fromLeft ? -20 : W + 20, dir: fromLeft ? 1 : -1, baseY: H * (0.22 + Math.random() * 0.25), t: 0, speed: 55 + Math.random() * 25 };
}
function wispPos() { return { x: wisp.x, y: wisp.baseY + Math.sin(wisp.t * 2.4) * 22 }; }
function catchWisp() {
  const p = wispPos();
  wisp = null; nextWisp = wispInterval();
  S.stats.wisps++;
  SFX.wisp(); vibrate(25);
  for (let i = 0; i < 26; i++) fx.spark(p.x, p.y, i % 2 ? '#fff3a8' : '#9fe6ff', 1.3);
  const bonus = 1 + 0.5 * art('lanter');
  const learned = [1, 2, 3].filter(i => S.skills[i].lvl > 0);
  const roll = Math.random();
  if (roll < 0.25 && S.mana < manaMax() * 0.8) {
    S.mana = manaMax();
    toast('O espírito encheu sua mana!', 'gold');
  } else if (roll < 0.5 && learned.length) {
    const i = learned[Math.floor(Math.random() * learned.length)];
    S.skills[i].until = Math.max(S.skills[i].until, S.clock) + SKILLS[i].dur(S.skills[i].lvl);
    toast(`O espírito ativou ${SKILLS[i].name} de graça!`, 'gold');
  } else {
    const g = goldFor(S.stage) * goldMult() * (20 + S.stage * 0.5) * bonus;
    S.gold += g; S.stats.gold += g;
    toast(`O espírito deixou +${fmt(g)} de ouro!`, 'gold');
  }
  uiDirty = true; saveSoon();
}

/* =========================================================
   AÇÕES DO JOGADOR
   ========================================================= */
const combo = { n: 0, t: 9 };
function doTap(x, y, auto) {
  if (!foe || foe.dead || spawnDelay > 0) return;
  if (!auto) {
    combo.n = combo.t < 0.6 ? combo.n + 1 : 1;
    combo.t = 0;
    if (combo.n > S.stats.maxCombo) S.stats.maxCombo = combo.n;
  }
  const crit = Math.random() < critChance();
  let d = tapDmg() * comboMult();
  if (crit) { d *= critMult(); S.stats.crits++; }
  S.stats.taps++;
  if (d > S.stats.maxTap) S.stats.maxTap = d;
  hero.atk = 0.14;
  fx.slash(x, y, crit);
  if (crit) { SFX.crit(); fx.shake(4); if (!auto) vibrate(15); }
  else { SFX.hit(); if (!auto) vibrate(6); }
  damage(d, x, y, crit ? 'crit' : 'tap');
}

function qtyFor(c0, g, lvl) {
  const q = S.settings.buyQty;
  if (q === 'max') return Math.max(1, maxN(c0, g, lvl, S.gold));
  return q;
}
function buyHero() {
  const n = qtyFor(HERO_C0, HERO_G, S.hero - 1);
  const c = heroCost(n);
  if (n < 1 || S.gold < c) return false;
  const before = S.hero;
  S.gold -= c; S.hero += n;
  if (Math.floor(before / 10) !== Math.floor(S.hero / 10)) structDirty = true;
  SFX.buy(); saveSoon(); uiDirty = true;
  return true;
}
function buyAlly(i) {
  const n = qtyFor(ALLIES[i].cost, ALLY_G, S.allies[i]);
  const c = allyCost(i, n);
  if (n < 1 || S.gold < c) return false;
  const was = S.allies[i];
  S.gold -= c; S.allies[i] += n;
  if (was === 0) { toast(`${ALLIES[i].name}, ${SPECIES[S.allyForms[i].sp]}, entrou para o grupo!`, 'gold'); structDirty = true; }
  SFX.buy(); saveSoon(); uiDirty = true;
  return true;
}
function buySkill(i) {
  const sk = SKILLS[i], st = S.skills[i];
  if (S.hero < sk.unlock || st.lvl >= SKILL_MAX) return false;
  const c = skillCost(i);
  if (S.gold < c) return false;
  S.gold -= c; st.lvl++;
  if (st.lvl === 1) toast(`${sk.name} aprendida! Use na barra de poderes.`, 'gold');
  SFX.buy(); saveSoon(); uiDirty = true;
  return true;
}
function useSkill(i) {
  const sk = SKILLS[i], st = S.skills[i];
  if (st.lvl < 1 || st.cd > S.clock || S.mana < sk.mana) {
    if (st.lvl >= 1 && S.mana < sk.mana && st.cd <= S.clock) toast('Mana insuficiente.', 'bad');
    return;
  }
  S.mana -= sk.mana;
  st.cd = S.clock + sk.cd;
  st.until = S.clock + sk.dur(st.lvl);
  S.stats.skills++;
  if (i === 0) {
    SFX.zap(); fx.lightning(); fx.shake(12); vibrate(30);
    const c = scene.monster();
    damage(tapDmg() * skillPower(0, st.lvl), c.x, c.y - c.r * 0.6, 'skill');
  } else {
    SFX.skill();
    toast(`${sk.name} ativada!`);
  }
  uiDirty = true;
}
function buyArtifact(a) {
  const l = art(a.id);
  if (a.max && l >= a.max) return false;
  const c = artCost(a);
  if (S.ess < c) return false;
  S.ess -= c; S.arts[a.id] = l + 1;
  SFX.buy(); save(); uiDirty = true;
  return true;
}
function claimAch(a) {
  const tier = S.ach[a.id] || 0;
  if (tier >= a.goals.length || a.get() < a.goals[tier]) return false;
  S.ach[a.id] = tier + 1;
  const r = tier + 1;
  S.ess += r; S.essTotal += r;
  SFX.prestige(); vibrate([15, 30, 15]);
  toast(`Conquista "${a.name}" ${tier + 1}! +${r} ${r > 1 ? 'essências' : 'essência'}`, 'gold');
  save(); uiDirty = true;
  return true;
}
function prestige() {
  const g = essGain();
  if (g <= 0) return;
  const keep = { ess: S.ess + g, essTotal: S.essTotal + g, arts: S.arts, prestiges: S.prestiges + 1, stats: S.stats, ach: S.ach,
    daily: S.daily, allyForms: S.allyForms, settings: S.settings, maxStage: S.maxStage, created: S.created, clock: S.clock };
  S = Object.assign(defaults(), keep);
  S.mana = manaMax();

  closeModal();
  structDirty = true; uiDirty = true;
  foe = null; spawnDelay = 0.6;

}
function challengeBoss() {
  if (!S.bossFailed) return;
  S.bossFailed = false; S.farmKills = 0; S.wave = WAVES - 1;

/* ---------- recompensa diária ---------- */
function dailyState() {
  const today = todayKey();
  if (S.daily.last === today) return { available: false, day: S.daily.streak };
  const y = new Date(); y.setDate(y.getDate() - 1);
  const day = S.daily.last === todayKey(y) ? (S.daily.streak % 7) + 1 : 1;
  return { available: true, day };
}
function dailyReward(day) {
  const gold = goldFor(Math.max(S.stage, 1)) * (25 * day) * (1 + 0.3 * art('bolsa'));
  const ess = day === 7 ? 3 : day === 4 ? 1 : 0;
  return { gold, ess };
}
function claimDaily() {
  const st = dailyState();
  if (!st.available) return;
  const r = dailyReward(st.day);
  S.gold += r.gold; S.stats.gold += r.gold;
  if (r.ess) { S.ess += r.ess; S.essTotal += r.ess; }
  S.daily = { last: todayKey(), streak: st.day };
  SFX.win(); vibrate([20, 40, 20]);
  toast(`Recompensa do dia ${st.day}: +${fmt(r.gold)} de ouro${r.ess ? ` e +${r.ess} essências` : ''}!`, 'gold');
  save(); uiDirty = true;
}
function dailyCardHTML(withButton) {
  const st = dailyState();
  const doneUpTo = st.available ? st.day - 1 : st.day;
  const r = dailyReward(st.available ? st.day : Math.min(7, st.day % 7 + 1));
  let days = '';
  for (let d = 1; d <= 7; d++) days += `<span class="${d <= doneUpTo ? 'done' : ''} ${st.available && d === st.day ? 'today' : ''}">Dia ${d}${d === 4 || d === 7 ? '◆' : ''}</span>`;
  return `<h3 class="gold">Recompensa diária</h3>
    <p>${st.available ? `Hoje é o <b>dia ${st.day}</b> da sua sequência: <b>+${fmt(r.gold)}</b> de ouro${r.ess ? ` e <b>+${r.ess}</b> essências` : ''}.` : 'Você já resgatou hoje. Volte amanhã para manter a sequência; se pular um dia, ela recomeça.'}</p>
    <div class="days">${days}</div>
    ${withButton && st.available ? '<div class="btns"><button class="btn primary" data-daily>Resgatar</button></div>' : ''}`;
}
let dailyPrompted = false;
function openDaily() {
  dailyPrompted = true;
  if (!dailyState().available) return;
  openModal(`<div class="card">${dailyCardHTML(false)}</div>
    <div class="btns"><button class="btn primary" id="okDaily">Resgatar</button><button class="btn" data-close>Depois</button></div>`,
    sh => sh.querySelector('#okDaily').addEventListener('click', () => { claimDaily(); closeModal(); }));
}

/* =========================================================
   PROGRESSO OFFLINE
   ========================================================= */
function offlineGains(seconds, showModal) {
  seconds = Math.min(seconds, OFFLINE_CAP);
  if (seconds < 5) return;
  S.clock += seconds;
  S.stats.offline += seconds;          // tempo fora NÃO conta como tempo jogando
  S.mana = Math.min(manaMax(), S.mana + manaRegen() * seconds);
  const d = dps(false);
  let gold = 0, kills = 0;
  if (d > 0) {
    const hp = hpFor(S.stage);
    kills = Math.floor(seconds / (hp / d + 0.4));
    gold = kills * goldFor(S.stage) * (1 + 0.3 * art('bolsa'));
  }
  if (gold > 0) { S.gold += gold; S.stats.gold += gold; S.stats.kills += kills; }
  if (showModal && seconds >= 60 && S.settings.offlineModal) {
    openModal(`
      <h2>Bem-vindo de volta!</h2>
      <p>Você ficou fora por <b>${fmtTime(seconds)}</b>${seconds >= OFFLINE_CAP ? ' (limite de 12 h)' : ''}.</p>
      ${gold > 0
        ? `<p>Seus aliados derrotaram <b>${fmt(kills)}</b> monstros e coletaram:</p><div class="big">+${fmt(gold)} de ouro</div>`
        : `<p>Contrate aliados na aba <b>Aliados</b>: eles lutam e coletam ouro mesmo com o jogo fechado.</p>`}
      <div class="btns"><button class="btn primary" data-close>Continuar</button></div>`);
  } else if (gold > 0) {
    toast(`+${fmt(gold)} de ouro enquanto você estava fora`, 'gold');
  }
  uiDirty = true;
}

const cv = $('#cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
let bgCanvas = null;
const hero = { atk: 0 };
const allyPos = [];

const scene = {
  ground() { return H * 0.87; },
  unit() { return Math.min(W / 400, H / 420); },
  monster() {
    const big = foe && foe.boss ? 1.25 : foe && foe.chest ? 0.85 : 1;
    const r = Math.min(W * 0.21, H * 0.29) * big;
    return { x: W * 0.64, y: this.ground() - r * 0.78, r };
  },
  heroPos() { return { x: W * 0.22, y: this.ground() }; },
  resize() {
    const rect = cv.getBoundingClientRect();
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = Math.max(1, rect.width); H = Math.max(1, rect.height);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    this.zoneChanged();
  },
  zoneChanged() {
    const z = zoneOf(S.stage);
    this.zoneKey = z.name;
    bgCanvas = document.createElement('canvas');
    bgCanvas.width = cv.width; bgCanvas.height = cv.height;
    const b = bgCanvas.getContext('2d');
    b.scale(DPR, DPR);
    const g = b.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, z.sky[0]); g.addColorStop(1, z.sky[1]);
    b.fillStyle = g; b.fillRect(0, 0, W, H);
    const r = rng(Math.floor((S.stage - 1) / 10) * 31 + 7);
    b.fillStyle = 'rgba(255,255,255,0.7)';
    for (let i = 0; i < 40; i++) { b.globalAlpha = r() * 0.6; b.fillRect(r() * W, r() * H * 0.5, 1.5, 1.5); }
    b.globalAlpha = 1;
    b.fillStyle = 'rgba(255,240,210,0.18)';
    b.beginPath(); b.arc(W * 0.82, H * 0.2, H * 0.1, 0, Math.PI * 2); b.fill();
    const layer = (color, base, amp, peaks) => {
      b.fillStyle = color; b.beginPath(); b.moveTo(0, H);
      const n = peaks * 2;
      for (let i = 0; i <= n; i++) {
        const x = (i / n) * W;
        const y = base - (i % 2 ? amp * (0.6 + r() * 0.6) : amp * r() * 0.3);
        b.lineTo(x, y);
      }
      b.lineTo(W, H); b.closePath(); b.fill();
    };
    layer(z.far, H * 0.64, H * 0.32, 5);
    layer(z.near, H * 0.78, H * 0.15, 8);
    b.fillStyle = z.ground; b.fillRect(0, this.ground(), W, H);
    b.fillStyle = 'rgba(0,0,0,0.18)'; b.fillRect(0, this.ground(), W, 3);
    for (let i = 0; i < 30; i++) {
      b.fillStyle = `rgba(0,0,0,${0.05 + r() * 0.1})`;
      b.fillRect(r() * W, this.ground() + 6 + r() * (H - this.ground()), 4 + r() * 12, 2);
    }
  },
};

/* ---------- efeitos ---------- */
const parts = [], nums = [], slashes = [], projs = [], bolts = [];
let shakeT = 0, shakeA = 0, flashT = 0;
const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const fx = {
  number(amount, x, y, kind) {
    if (nums.length > 30) nums.shift();
    nums.push({ txt: fmt(amount), x: x + (Math.random() - 0.5) * 30, y, t: 0, kind });
  },
  slash(x, y, crit) {
    if (slashes.length > 12) slashes.shift();
    slashes.push({ x, y, a: Math.random() * Math.PI, t: 0, crit });
    if (S.settings.particles) for (let i = 0; i < (crit ? 10 : 4); i++) this.spark(x, y, crit ? '#ffe37a' : '#ffffff');
  },
  spark(x, y, color, speed = 1) {
    if (!S.settings.particles || parts.length > 260) return;
    const a = Math.random() * Math.PI * 2, v = (60 + Math.random() * 180) * speed;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, t: 0, life: 0.35 + Math.random() * 0.3, color, size: 2 + Math.random() * 3, g: 380 });
  },
  coinBurst(n) {
    const c = scene.monster();
    for (let i = 0; i < n; i++) {
      parts.push({ x: c.x, y: c.y, vx: (Math.random() - 0.5) * 260, vy: -160 - Math.random() * 220, t: 0, life: 0.9, color: '#ffc94a', size: 5, g: 600, coin: true });
    }
  },
  dieBurst() {
    if (!foe) return;
    const c = scene.monster();
    for (let i = 0; i < 24; i++) this.spark(c.x + (Math.random() - 0.5) * c.r, c.y + (Math.random() - 0.5) * c.r, `hsl(${foe.hue},70%,60%)`, 1.4);
  },
  shake(a) { if (!S.settings.shake || reducedMotion) return; shakeT = 0.25; shakeA = Math.max(shakeA, a); },
  lightning() {
    const c = scene.monster();
    const pts = []; let x = c.x + (Math.random() - 0.5) * 40, y = -10;
    while (y < c.y) { pts.push([x, y]); y += 20 + Math.random() * 25; x += (Math.random() - 0.5) * 50; }
    pts.push([c.x, c.y]);
    bolts.push({ pts, t: 0 });
    flashT = 0.25;
  },
};

/* ---------- desenho ---------- */
function drawMonster(m, t) {
  const c = scene.monster();
  let { x, y, r } = c;
  const born = clamp(m.born / 0.25, 0, 1);
  let sx = 1, sy = 1 + Math.sin(t * 3) * 0.03;
  if (m.hit > 0) { sx = 1.08; sy = 0.92; x += 6; }
  let alpha = 1;
  if (m.dead) { const k = clamp(m.deathT / 0.35, 0, 1); sx *= 1 + k * 0.3; sy *= 1 - k * 0.6; alpha = 1 - k; }
  const scale = 0.4 + 0.6 * born;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath(); ctx.ellipse(c.x, scene.ground() + 2, r * 0.9 * scale, r * 0.16 * scale, 0, 0, Math.PI * 2); ctx.fill();
  ctx.translate(x, y + r * 0.78);
  ctx.scale(sx * scale, sy * scale);
  ctx.translate(0, -r * 0.78);

  if (m.chest) { drawChest(m, r, t); ctx.restore(); return; }

  const light = `hsl(${m.hue},${m.sat}%,64%)`, dark = `hsl(${m.hue},${m.sat}%,30%)`;
  if (m.boss) {
    ctx.save();
    ctx.globalAlpha = alpha * (0.35 + Math.sin(t * 4) * 0.1);
    const ag = ctx.createRadialGradient(0, 0, r * 0.5, 0, 0, r * 1.5);
    ag.addColorStop(0, 'rgba(255,60,90,0.8)'); ag.addColorStop(1, 'rgba(255,60,90,0)');
    ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(0, 0, r * 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = dark;
  ctx.beginPath(); ctx.ellipse(-r * 0.4, r * 0.72, r * 0.22, r * 0.12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(r * 0.4, r * 0.72, r * 0.22, r * 0.12, 0, 0, Math.PI * 2); ctx.fill();
  if (m.horns) {
    ctx.fillStyle = m.boss ? '#3a1a22' : '#f1e6c8';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(s * r * 0.35, -r * 0.7);
      ctx.quadraticCurveTo(s * r * 0.9, -r * (0.9 + m.hornLen), s * r * (0.55 + m.hornLen * 0.6), -r * (1.1 + m.hornLen));
      ctx.quadraticCurveTo(s * r * 0.55, -r * 0.95, s * r * 0.6, -r * 0.55);
      ctx.closePath(); ctx.fill();
    }
  }
  const body = new Path2D();
  const N = 48;
  for (let i = 0; i <= N; i++) {
    const a = (i / N) * Math.PI * 2;
    const rr = r * (1 + m.amp * Math.sin(m.lobes * a + m.phase + t * 0.8));
    let px = Math.cos(a) * rr, py = Math.sin(a) * rr * 0.92;
    if (py > r * 0.7) py = r * 0.7 + (py - r * 0.7) * 0.25;
    if (i === 0) body.moveTo(px, py); else body.lineTo(px, py);
  }
  body.closePath();
  const bg = ctx.createRadialGradient(-r * 0.3, -r * 0.4, r * 0.1, 0, 0, r * 1.1);
  bg.addColorStop(0, light); bg.addColorStop(1, dark);
  ctx.fillStyle = bg; ctx.fill(body);
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.stroke(body);
  if (m.spikes) {
    ctx.fillStyle = dark;
    for (let i = -2; i <= 2; i++) {
      const a = -Math.PI / 2 + i * 0.35;
      const bx = Math.cos(a) * r * 0.92, by = Math.sin(a) * r * 0.86;
      ctx.beginPath();
      ctx.moveTo(bx - 8, by + 4); ctx.lineTo(bx + Math.cos(a) * r * 0.22, by + Math.sin(a) * r * 0.22); ctx.lineTo(bx + 8, by + 4);
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.fillStyle = `hsla(${m.hue},${m.sat}%,82%,0.35)`;
  ctx.beginPath(); ctx.ellipse(0, r * 0.3, r * 0.5, r * 0.32, 0, 0, Math.PI * 2); ctx.fill();
  const ey = -r * 0.25;
  const spread = m.eyes === 1 ? [0] : m.eyes === 2 ? [-0.3, 0.3] : [-0.4, 0, 0.4];
  const er = r * (m.eyes === 1 ? 0.26 : m.eyes === 2 ? 0.18 : 0.14);
  const blink = (Math.sin(t * 1.3 + m.phase * 5) > 0.985) ? 0.15 : 1;
  for (const s of spread) {
    const yy = ey - (s === 0 && m.eyes === 3 ? r * 0.12 : 0);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(s * r, yy, er, er * blink, 0, 0, Math.PI * 2); ctx.fill();
    if (blink === 1) {
      ctx.fillStyle = m.boss ? '#c3102e' : '#1a1030';
      ctx.beginPath(); ctx.arc(s * r - er * 0.35, yy + er * 0.1, er * 0.5, 0, Math.PI * 2); ctx.fill();
    }
  }
  if (m.boss) {
    ctx.strokeStyle = '#1a1030'; ctx.lineWidth = 4;
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(s * r * 0.55, ey - er * 1.6); ctx.lineTo(s * r * 0.12, ey - er * 0.9); ctx.stroke(); }
  }
  ctx.fillStyle = '#2a0d1a';
  ctx.beginPath(); ctx.ellipse(0, r * 0.2, r * 0.32, r * (m.hit > 0 ? 0.2 : 0.12), 0, 0, Math.PI); ctx.fill();
  ctx.fillStyle = '#fff';
  for (const s of [-0.18, 0.18]) { ctx.beginPath(); ctx.moveTo(s * r - 5, r * 0.2); ctx.lineTo(s * r, r * 0.3); ctx.lineTo(s * r + 5, r * 0.2); ctx.fill(); }
  if (m.boss) {
    ctx.fillStyle = '#ffc94a'; ctx.strokeStyle = '#8a5a10'; ctx.lineWidth = 2;
    ctx.beginPath();
    const cw = r * 0.5, cy = -r * 0.92;
    ctx.moveTo(-cw, cy); ctx.lineTo(-cw, cy - r * 0.25); ctx.lineTo(-cw * 0.5, cy - r * 0.1); ctx.lineTo(0, cy - r * 0.32);
    ctx.lineTo(cw * 0.5, cy - r * 0.1); ctx.lineTo(cw, cy - r * 0.25); ctx.lineTo(cw, cy); ctx.closePath();
    ctx.fill(); ctx.stroke();
  }
  if (m.hit > 0) { ctx.fillStyle = `rgba(255,255,255,${m.hit * 4})`; ctx.fill(body); }
  ctx.restore();
}

function drawChest(m, r, t) {
  const w = r * 1.5, h = r * 1.1, open = Math.sin(t * 6) * 0.08 + 0.15;
  ctx.fillStyle = '#7a4a22'; ctx.strokeStyle = '#3a210c'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.rect(-w / 2, -h * 0.2, w, h * 0.85); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.translate(-w / 2, -h * 0.2); ctx.rotate(-open);
  ctx.fillStyle = '#8f5a2a'; ctx.beginPath(); ctx.rect(0, -h * 0.4, w, h * 0.4); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffc94a'; ctx.fillRect(0, -h * 0.08, w, h * 0.08);
  ctx.restore();
  ctx.fillStyle = '#2a0d1a'; ctx.fillRect(-w / 2 + 6, -h * 0.22, w - 12, 8);
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 6; i++) { const x = -w / 2 + 12 + i * (w - 24) / 5; ctx.beginPath(); ctx.moveTo(x - 6, -h * 0.2); ctx.lineTo(x, -h * 0.08); ctx.lineTo(x + 6, -h * 0.2); ctx.fill(); }
  ctx.fillStyle = '#ffc94a'; ctx.fillRect(-w / 2, h * 0.2, w, h * 0.08);
  ctx.beginPath(); ctx.arc(0, h * 0.24, r * 0.14, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ff3b5c'; ctx.beginPath(); ctx.arc(-r * 0.25, -h * 0.32 - open * 30, 6, 0, Math.PI * 2); ctx.arc(r * 0.25, -h * 0.32 - open * 30, 6, 0, Math.PI * 2); ctx.fill();
  if (m.hit > 0) { ctx.fillStyle = `rgba(255,255,255,${m.hit * 3})`; ctx.fillRect(-w / 2, -h * 0.6, w, h * 1.25); }
}

function drawHero(t) {
  const p = scene.heroPos();
  const s = scene.unit();
  const fury = skillActive(1);
  const lunge = hero.atk > 0 ? Math.sin((hero.atk / 0.14) * Math.PI) * 18 * s : 0;
  ctx.save();
  ctx.translate(p.x + lunge, p.y);
  ctx.scale(s, s);
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath(); ctx.ellipse(0, 2, 30, 6, 0, 0, Math.PI * 2); ctx.fill();
  const bob = Math.sin(t * 4) * 2;
  if (fury) {
    ctx.fillStyle = `rgba(255,90,60,${0.25 + Math.sin(t * 12) * 0.1})`;
    ctx.beginPath(); ctx.ellipse(0, -45, 42, 56, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = '#7a2a8a';
  ctx.beginPath(); ctx.moveTo(-8, -70 + bob); ctx.quadraticCurveTo(-34 - Math.sin(t * 5) * 4, -40, -26, -6); ctx.lineTo(4, -12); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2a2448';
  ctx.fillRect(-10, -26, 8, 26); ctx.fillRect(3, -26, 8, 26);
  ctx.fillStyle = '#3f6fd1';
  ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(-14, -66 + bob, 28, 42, 8); else ctx.rect(-14, -66 + bob, 28, 42); ctx.fill();
  ctx.fillStyle = '#ffc94a'; ctx.fillRect(-14, -36 + bob, 28, 5);
  ctx.fillStyle = '#f2c9a0'; ctx.beginPath(); ctx.arc(0, -80 + bob, 14, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2a1a12'; ctx.beginPath(); ctx.arc(-2, -86 + bob, 15, Math.PI * 0.95, Math.PI * 2.05); ctx.fill();
  ctx.fillStyle = '#1a1030'; ctx.fillRect(4, -82 + bob, 3, 4);
  const ang = hero.atk > 0 ? lerp(-1.2, 1.1, 1 - hero.atk / 0.14) : -0.5 + Math.sin(t * 2) * 0.05;
  ctx.save(); ctx.translate(12, -52 + bob); ctx.rotate(ang);
  ctx.fillStyle = '#8a5a10'; ctx.fillRect(-3, -4, 6, 14);
  ctx.fillStyle = '#ffc94a'; ctx.fillRect(-10, -6, 20, 4);
  const blade = ctx.createLinearGradient(0, -60, 0, -6);
  blade.addColorStop(0, fury ? '#ffb38a' : '#e9f6ff'); blade.addColorStop(1, fury ? '#ff5a3c' : '#7fb8ff');
  ctx.fillStyle = blade; ctx.beginPath(); ctx.moveTo(-4, -6); ctx.lineTo(0, -62); ctx.lineTo(4, -6); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(140,220,255,0.9)';
  for (let i = 0; i < 3; i++) ctx.fillRect(-1, -20 - i * 12, 2, 5);
  ctx.restore();
  ctx.restore();
}

// Formação fixa: no máximo ALLY_SHOWN criaturas na cena, as mais fortes. O resto aparece só como contador.
const SLOTS = [[0.07, 34], [0.36, 158], [0.08, 122], [0.21, 168], [0.05, 205], [0.33, 228]];
let allyFireT = [];
function shownAllies() {
  const owned = [];
  for (let i = 0; i < ALLIES.length; i++) if (S.allies[i] > 0) owned.push(i);
  owned.sort((a, b) => allyDps(b) - allyDps(a));
  return { list: owned.slice(0, ALLY_SHOWN), total: owned.length };
}
let shownCache = { list: [], total: 0 };
function drawAllies(t, dt) {
  const shout = skillActive(3);
  const u = scene.unit();
  const gy = scene.ground();
  shownCache.list.forEach((i, k) => {
    const [fx_, hu] = SLOTS[k];
    const f = S.allyForms[i];
    const x = W * fx_ + 10 * u;
    const y = Math.max(gy - hu * u, 88) + Math.sin(t * 2 + i) * 4 * u;
    allyPos[i] = { x, y };
    const sc = 1.3 * u;
    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = shout ? '#ffc94a' : `hsl(${f.hue},90%,70%)`;
    ctx.beginPath(); ctx.ellipse(x, y + 2 * sc, 16 * sc, 13 * sc, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.translate(x, y); ctx.scale(sc, sc);
    drawCreature(ctx, f.sp, f.hue, t + i);
    ctx.restore();
    allyFireT[i] = (allyFireT[i] ?? Math.random()) - dt * (shout ? 2 : 1);
    if (allyFireT[i] <= 0 && foe && !foe.dead && spawnDelay <= 0) {
      allyFireT[i] = 0.8 + Math.random() * 0.8;
      const m = scene.monster();
      if (projs.length < 30) projs.push({ x: x + 14 * sc, y, tx: m.x + (Math.random() - 0.5) * m.r, ty: m.y + (Math.random() - 0.5) * m.r, t: 0, color: `hsl(${f.hue},90%,70%)` });
    }
  });
}

function drawWisp(t) {
  if (!wisp) return;
  const p = wispPos();
  const pulse = 1 + Math.sin(t * 8) * 0.12;
  const g = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, 26 * pulse);
  g.addColorStop(0, 'rgba(255,255,230,1)'); g.addColorStop(0.35, 'rgba(160,240,255,0.8)'); g.addColorStop(1, 'rgba(120,200,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, 26 * pulse, 0, Math.PI * 2); ctx.fill();
  const fl = Math.sin(t * 20) * 0.5;
  ctx.fillStyle = 'rgba(230,250,255,0.75)';
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(p.x + s * 9, p.y - 6, 9, 4, s * (0.6 + fl), 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI * 2); ctx.fill();
  if (Math.random() < 0.5 && S.settings.particles) parts.push({ x: p.x - wisp.dir * 8, y: p.y, vx: -wisp.dir * 20, vy: 10, t: 0, life: 0.6, color: '#bff4ff', size: 2.5, g: 0 });
}

function render(t, dt) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  let ox = 0, oy = 0;
  if (shakeT > 0) { ox = (Math.random() - 0.5) * shakeA; oy = (Math.random() - 0.5) * shakeA; }
  if (bgCanvas) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(bgCanvas, ox * DPR, oy * DPR); ctx.setTransform(DPR, 0, 0, DPR, ox * DPR, oy * DPR); }
  ctx.fillStyle = 'rgba(255,230,180,0.35)';
  for (let i = 0; i < 14; i++) {
    const x = ((i * 97 + t * (8 + i)) % (W + 20)) - 10;
    const y = (H * 0.7 - ((t * (10 + i * 2) + i * 53) % (H * 0.7)));
    ctx.fillRect(x, y, 2, 2);
  }
  drawAllies(t, dt);
  drawHero(t);
  if (foe) drawMonster(foe, t);

  for (let i = projs.length - 1; i >= 0; i--) {
    const p = projs[i]; p.t += dt / 0.35;
    if (p.t >= 1) { for (let k = 0; k < 2; k++) fx.spark(p.tx, p.ty, p.color, 0.5); projs.splice(i, 1); continue; }
    const x = lerp(p.x, p.tx, p.t), y = lerp(p.y, p.ty, p.t) - Math.sin(p.t * Math.PI) * 30;
    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI * 2); ctx.fill();
  }
  for (let i = slashes.length - 1; i >= 0; i--) {
    const s = slashes[i]; s.t += dt;
    if (s.t > 0.2) { slashes.splice(i, 1); continue; }
    const k = s.t / 0.2;
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.a);
    ctx.strokeStyle = s.crit ? `rgba(255,220,90,${1 - k})` : `rgba(255,255,255,${1 - k})`;
    ctx.lineWidth = (s.crit ? 7 : 4) * (1 - k) + 1; ctx.lineCap = 'round';
    const L = (s.crit ? 60 : 40) * (0.6 + k);
    ctx.beginPath(); ctx.arc(0, L * 0.6, L, -Math.PI * 0.8, -Math.PI * 0.2); ctx.stroke();
    ctx.restore();
  }
  for (let i = bolts.length - 1; i >= 0; i--) {
    const b = bolts[i]; b.t += dt;
    if (b.t > 0.35) { bolts.splice(i, 1); continue; }
    ctx.strokeStyle = `rgba(200,240,255,${1 - b.t / 0.35})`; ctx.lineWidth = 6; ctx.lineJoin = 'round';
    ctx.shadowColor = '#7fd8ff'; ctx.shadowBlur = 20;
    ctx.beginPath(); b.pts.forEach(([x, y], j) => j ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  drawWisp(t);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.t += dt;
    if (p.t > p.life) { parts.splice(i, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.coin && p.y > scene.ground() - 4) { p.y = scene.ground() - 4; p.vy *= -0.4; p.vx *= 0.7; }
    ctx.globalAlpha = 1 - p.t / p.life;
    ctx.fillStyle = p.color;
    if (p.coin) { ctx.beginPath(); ctx.ellipse(p.x, p.y, p.size * Math.abs(Math.cos(p.t * 12)) + 1, p.size, 0, 0, Math.PI * 2); ctx.fill(); }
    else ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = nums.length - 1; i >= 0; i--) {
    const n = nums[i]; n.t += dt;
    if (n.t > 0.8) { nums.splice(i, 1); continue; }
    const k = n.t / 0.8;
    const size = n.kind === 'crit' ? 26 : n.kind === 'skill' ? 30 : 17;
    ctx.font = `${size * (n.t < 0.08 ? 1.3 : 1)}px Bungee, Impact, sans-serif`;
    ctx.globalAlpha = 1 - k * k;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,10,30,0.8)';
    const y = n.y - 40 * k - 10;
    const txt = n.kind === 'crit' ? n.txt + '!' : n.txt;
    ctx.strokeText(txt, n.x, y);
    ctx.fillStyle = n.kind === 'crit' ? '#ffd84a' : n.kind === 'skill' ? '#9fe6ff' : '#ffffff';
    ctx.fillText(txt, n.x, y);
  }
  ctx.globalAlpha = 1;
  // combo
  if (combo.n >= 5 && combo.t < 0.6) {
    const hp = scene.heroPos();
    ctx.font = `${Math.round(15 * clamp(scene.unit(), 0.8, 1.4))}px Bungee, Impact, sans-serif`;
    ctx.globalAlpha = 1 - combo.t / 0.6 * 0.6;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,10,30,0.85)';
    const txt = `COMBO ${combo.n}  +${Math.round((comboMult() - 1) * 100)}%`;
    const y = hp.y - 120 * scene.unit();
    ctx.strokeText(txt, W * 0.5, Math.max(y, 80));
    ctx.fillStyle = combo.n >= 100 ? '#ff8a5a' : '#ffd84a';
    ctx.fillText(txt, W * 0.5, Math.max(y, 80));
    ctx.globalAlpha = 1;
  }
  if (flashT > 0) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(220,245,255,${flashT})`; ctx.fillRect(0, 0, cv.width, cv.height); }
  if (skillActive(2)) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = 'rgba(255,201,74,0.6)';
    for (let i = 0; i < 10; i++) { const x = (i * 131 + t * 40) % W, y = (t * 120 + i * 77) % H; ctx.fillRect(x, y, 3, 6); }
  }
}

];
let tab = 'heroi';
let uiDirty = true, structDirty = true;
let rows = [];

function buildTabs() {

function rowHTML(key, av, avColor) {
  return `<div class="row" data-key="${key}">

    <div class="info"><div class="t"></div><div class="s"></div></div>

}

function highestAlly() { return S.allies.reduce((h, l, i) => l > 0 ? i : h, -1); }

function buildList() {
  const L = $('#list');
  $('#qty').hidden = !(tab === 'heroi' || tab === 'aliados');
  rows = [];
  let html = '';
  if (tab === 'heroi') {
    html += rowHTML('hero', ICON.hero, 'linear-gradient(135deg,#ffd977,#ff9f5a)');
    html += `<div class="card" id="heroCard"></div>`;
    html += `<p class="muted">Dica: segure o botão de compra para comprar várias vezes. Toque rápido no monstro para manter o combo.</p>`;
  } else if (tab === 'aliados') {
    const highest = highestAlly();
    for (let i = 0; i < ALLIES.length; i++) {
      if (i > highest + 2) break;
      const locked = i > highest + 1;
      html += rowHTML('ally' + i, locked ? '?' : `<img alt="" src="${creatureAvatar(i)}">`, locked ? 'var(--line)' : 'transparent');
    }
    html += `<p class="muted">Cada aliado é uma criatura mística sorteada no início da sua jornada. No nível 10 o dano dobra, e a cada 25 níveis é multiplicado por 4. A cena mostra os ${ALLY_SHOWN} mais fortes.</p>`;
  } else if (tab === 'habilidades') {
    SKILLS.forEach((s, i) => { html += rowHTML('skill' + i, ICON['s' + i], 'var(--ink)'); });
    html += `<p class="muted">Use os poderes na barra acima do painel (ou teclas 1 a 4). Eles gastam mana, que se recupera sozinha.</p>`;
  } else if (tab === 'reliquias') {
    html += `<div class="card" id="essCard"></div>`;
    html += rowHTML('prestige', ICON.gem, 'linear-gradient(135deg,#dcb2ff,#8a4fd6)');
    html += `<div class="sectionLabel">Artefatos permanentes</div>`;
    ARTIFACTS.forEach(a => { html += rowHTML('art_' + a.id, ICON.relic, a.color); });
  } else {
    html += `<div class="card" id="dailyCard"></div>`;
    html += `<div class="sectionLabel">Conquistas (dão essências)</div>`;
    ACH.forEach(a => { html += rowHTML('ach_' + a.id, ICON.trophy, 'linear-gradient(135deg,#ffd977,#c9871c)'); });
    html += `<div class="sectionLabel">Estatísticas</div><div class="card"><dl class="stats" id="statsDl"></dl></div>`;
  }
  L.innerHTML = html;
  L.querySelectorAll('.row').forEach(el => {
    rows.push({ key: el.dataset.key, el, t: el.querySelector('.t'), s: el.querySelector('.s'), btn: el.querySelector('.buy'), a: el.querySelector('.buy .a'), b: el.querySelector('.buy .b') });
  });
  structDirty = false;
  updateList();
}

function setText(el, v) { if (el && el._v !== v) { el._v = v; el.innerHTML = v; } }
function stars(n, of) { return '★'.repeat(n) + '☆'.repeat(of - n); }

function bestAlly() {
  let best = -1, bestV = 0;
  const highest = highestAlly();
  for (let i = 0; i <= Math.min(highest + 1, ALLIES.length - 1); i++) {
    const l = S.allies[i], n = qtyFor(ALLIES[i].cost, ALLY_G, l);
    const gain = allyDps(i, l + n) - allyDps(i, l);
    const v = gain / allyCost(i, n);
    if (v > bestV) { bestV = v; best = i; }
  }
  return best;
}

function updateList() {
  const best = tab === 'aliados' ? bestAlly() : -1;
  for (const r of rows) {
    const k = r.key;
    let title, sub, a, b, can, locked = false, cls = '';
    if (k === 'hero') {
      const n = qtyFor(HERO_C0, HERO_G, S.hero - 1), c = heroCost(n);
      const next = Math.floor(S.hero / 10) * 10 + 10;
      title = `Kael, o Rúnico <em>Nv ${S.hero}</em>`;
      sub = `Dano de toque: <b>${fmt(tapDmg())}</b><br>Nv ${next}: dano ×1,75`;
      a = `+${n} Nv`; b = ICON.coin + fmt(c); can = S.gold >= c;
    } else if (k.startsWith('ally')) {
      const i = +k.slice(4), A = ALLIES[i], l = S.allies[i];
      locked = i > highestAlly() + 1;
      const n = qtyFor(A.cost, ALLY_G, l), c = allyCost(i, n);
      if (locked) { title = '???'; sub = `Contrate ${ALLIES[i - 1].name} para revelar esta criatura`; a = 'Bloqueado'; b = ICON.coin + fmt(A.cost); can = false; }
      else {
        title = `${A.name} <em>${l ? 'Nv ' + l : ''}</em>${i === best ? '<span class="chip">melhor compra</span>' : ''}`;
        const nextMs = l < 10 ? 10 : Math.floor(l / 25) * 25 + 25;
        sub = `${SPECIES[S.allyForms[i].sp]}<br>${l ? `DPS: <b>${fmt(allyDps(i) * allyFactor())}</b> · ` : `DPS base: <b>${fmt(A.dps)}</b> · `}Nv ${nextMs}: ×${l < 10 ? 2 : 4}`;
        a = l ? `+${n} Nv` : (n > 1 ? `Contratar +${n}` : 'Contratar'); b = ICON.coin + fmt(c); can = S.gold >= c;
      }
      r.el.classList.toggle('best', i === best);
    } else if (k.startsWith('skill')) {
      const i = +k.slice(5), sk = SKILLS[i], st = S.skills[i];
      locked = S.hero < sk.unlock;
      title = `${sk.name} <em>${st.lvl ? 'Nv ' + st.lvl : ''}</em>`;
      sub = locked ? `Requer herói no nível <b>${sk.unlock}</b>` : `${sk.desc(st.lvl)}<br>Mana: <b>${sk.mana}</b> · Recarga: <b>${sk.cd} s</b>`;
      if (st.lvl >= SKILL_MAX) { a = 'Máximo'; b = '—'; can = false; }
      else { a = st.lvl ? 'Melhorar' : 'Aprender'; b = ICON.coin + fmt(skillCost(i)); can = !locked && S.gold >= skillCost(i); }
    } else if (k === 'prestige') {
      const g = essGain();
      title = 'Renascer';
      sub = S.runMaxStage < PRESTIGE_STAGE
        ? `Alcance o estágio <b>${PRESTIGE_STAGE}</b> para renascer. Recorde desta jornada: <b>${S.runMaxStage}</b>.`
        : `Recomece do estágio 1 e ganhe <b>${g}</b> essências. Quanto mais longe, mais essências.`;
      a = 'Ganhar'; b = ICON.gem + g; can = g > 0; cls = 'ess';
    } else if (k.startsWith('art_')) {
      const A = ARTIFACTS.find(x => 'art_' + x.id === k), l = art(A.id);
      title = `${A.name} <em>${l ? 'Nv ' + l : ''}</em>`;
      sub = l ? `${A.desc(l)}<br>Próximo: ${A.desc(l + 1)}` : A.desc(1);
      if (A.max && l >= A.max) { a = 'Máximo'; b = '—'; can = false; }
      else { a = l ? 'Melhorar' : 'Comprar'; b = ICON.gem + artCost(A); can = S.ess >= artCost(A); }
      cls = 'ess';
    } else if (k.startsWith('ach_')) {
      const A = ACH.find(x => 'ach_' + x.id === k), tier = S.ach[A.id] || 0, done = tier >= A.goals.length;
      const v = A.get();
      title = `${A.name} <span class="stars">${stars(tier, A.goals.length)}</span>`;
      sub = done ? 'Todas as etapas concluídas!' : `<b>${fmt(Math.min(v, A.goals[tier]))}</b> / ${fmt(A.goals[tier])} ${A.unit}`;
      if (done) { a = 'Completo'; b = '✓'; can = false; }
      else { a = v >= A.goals[tier] ? 'Resgatar' : 'Recompensa'; b = ICON.gem + (tier + 1); can = v >= A.goals[tier]; }
      cls = 'ess';
    }
    setText(r.t, title); setText(r.s, sub); setText(r.a, a); setText(r.b, b);
    r.btn.disabled = !can;
    if (cls) r.btn.classList.add(cls);
    r.el.classList.toggle('locked', locked);
  }
  setText($('#heroCard'), `<p>Chance de crítico: <b>${fmtPlain(critChance() * 100)}%</b> · Dano crítico: <b>×${fmtPlain(critMult())}</b><br>
    Bônus de dano permanente: <b>×${fmtPlain(dmgMult())}</b> · Combo máximo: <b>+40%</b> (100 toques seguidos)<br>
    O toque inclui <b>4%</b> do DPS dos aliados.</p>`);
  setText($('#essCard'), `<h3>${S.ess} essências</h3><p>Você já ganhou <b>${S.essTotal}</b> essências no total. Cada uma dá <b>+10%</b> de dano para sempre, mesmo depois de gasta. Renascimentos: <b>${S.prestiges}</b>.</p>`);
  setText($('#dailyCard'), dailyCardHTML(true));
  const dl = $('#statsDl');
  if (dl) {
    const st = S.stats;
    setText(dl, [
      ['Tempo jogando (ativo)', fmtTime(st.active)], ['Tempo com o jogo aberto', fmtTime(st.open)], ['Tempo fora (offline)', fmtTime(st.offline)],
      ['Estágio máximo', S.maxStage], ['Estágio desta jornada', S.runMaxStage], ['Toques', fmt(st.taps)], ['Críticos', fmt(st.crits)],
      ['Maior golpe', fmt(st.maxTap)], ['Maior combo', fmt(st.maxCombo)], ['Monstros derrotados', fmt(st.kills)], ['Chefes derrotados', fmt(st.bosses)],
      ['Baús Vivos', fmt(st.chests)], ['Espíritos tocados', fmt(st.wisps)], ['Ouro total ganho', fmt(st.gold)], ['Poderes usados', fmt(st.skills)],
      ['Renascimentos', S.prestiges],
    ].map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join(''));
  }
}

function tabBadges() {
  const can = {
    heroi: S.gold >= heroCost(1),
    aliados: ALLIES.some((A, i) => i <= highestAlly() + 1 && S.gold >= allyCost(i, 1)),
    habilidades: SKILLS.some((sk, i) => S.hero >= sk.unlock && S.skills[i].lvl < SKILL_MAX && S.gold >= skillCost(i)),
    reliquias: essGain() > 0 || ARTIFACTS.some(a => !(a.max && art(a.id) >= a.max) && S.ess >= artCost(a)),
    conquistas: dailyState().available || ACH.some(a => { const t = S.ach[a.id] || 0; return t < a.goals.length && a.get() >= a.goals[t]; }),
  };
  document.querySelectorAll('#tabs [data-tab]').forEach(b => b.classList.toggle('has', !!can[b.dataset.tab]));
}

  $('#skills').innerHTML = SKILLS.map((s, i) => `<button class="skill" data-skill="${i}" aria-label="${s.name}">

}
