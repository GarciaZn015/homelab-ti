    sh.querySelector('#musicVol').addEventListener('change', () => save());
    sh.querySelector('#notation').addEventListener('change', e => { st.notation = e.target.value; uiDirty = true; save(); });
    sh.querySelector('#autosave').addEventListener('change', e => { st.autosave = +e.target.value; save(); });
    sh.querySelector('#autoSalvage').addEventListener('change', e => { st.autoSalvage = +e.target.value; save(); });
    sh.querySelector('#saveNow').addEventListener('click', () => { save({ manual: true, snapshot: true }); upd(); });
    const box = sh.querySelector('#codeBox');
    sh.querySelector('#exportBtn').addEventListener('click', () => {
      save();
      const code = exportCode();
      box.value = code;
      const done = () => toast('Código copiado.');
      const fallback = () => { box.focus(); box.select(); toast('Selecione e copie o código na caixa.'); };
      try { navigator.clipboard.writeText(code).then(done, fallback); } catch (e) { fallback(); }
    });
    sh.querySelector('#dlBtn').addEventListener('click', () => {
      save();
      if (!downloadText(`lamina-runica-backup-${stamp()}.txt`, exportCode())) toast('O navegador bloqueou o download. Use “Gerar e copiar código”.', 'bad');
    });
    sh.querySelector('#importBtn').addEventListener('click', () => tryImport(box.value));
    sh.querySelector('#fileIn').addEventListener('change', e => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      if (f.size > MAX_CODE_CHARS) { toast(IMPORT_ERRORS.too_big, 'bad'); return; }
      const rd = new FileReader(); rd.onload = () => tryImport(String(rd.result)); rd.onerror = () => toast('Não foi possível ler o arquivo.', 'bad'); rd.readAsText(f);
    });
    sh.querySelectorAll('[data-restore]').forEach(b => b.addEventListener('click', () => restoreSafety(b.dataset.restore, SAFETY_LABELS[b.dataset.restore])));
    const rb = sh.querySelector('#resetBtn');
    rb.addEventListener('click', () => {
      if (!rb.classList.contains('armed')) {
        rb.classList.add('armed'); rb.textContent = 'Toque de novo para confirmar';
        setTimeout(() => { rb.classList.remove('armed'); rb.textContent = 'Apagar todo o progresso'; }, 4000);
        return;
      }
      if (Store.backend && !writeSafety('reset', serialize())) { toast('Não foi possível guardar uma cópia antes de apagar. Nada foi apagado.', 'bad'); return; }
      Store.del(SAVE_KEY); Store.del(BACKUP_KEY);
      for (let i = 0; i < SNAP_COUNT; i++) Store.del(SNAP_KEY + i);
      dailyPrompted = true;
      applyState(defaults(), {}); cloudSave(); closeModal(); toast('Progresso apagado. Uma cópia ficou guardada nas Configurações.');
    });
  });
}

function openPrestige() {
  const g = essGain();
  if (g <= 0) return;
  openModal(`
    <h2>Renascer?</h2>
    <p>Você volta ao estágio 1. Ouro, nível do herói, aliados e poderes são reiniciados.</p>
    <p>Você mantém essências, artefatos, equipamentos, conquistas, estatísticas, suas criaturas e as configurações.</p>
    <div class="big" style="color:var(--essence)">+${g} essências</div>
    <p>Dano permanente: <b>×${fmtPlain(dmgMult())}</b> → <b>×${fmtPlain((1 + 0.1 * (S.essTotal + g)) * (1 + 0.5 * art('elmo')))}</b></p>
    <div class="btns"><button class="btn purple" id="okPrestige">Renascer agora</button><button class="btn" data-close>Ainda não</button></div>`,
    sh => sh.querySelector('#okPrestige').addEventListener('click', prestige));
}

// Troca o estado inteiro (importar, recuperar, apagar). Retorna se a gravação deu certo.
function applyState(s, opts) {
  S = s;
  foe = null; spawnDelay = 0.2; wisp = null;
  parts.length = nums.length = slashes.length = projs.length = 0;
  buildTabs(); structDirty = true; uiDirty = true;
  applyA11y(); syncMute();
  scene.zoneChanged();
  return save(opts || {});
}

/* ---------- eventos ---------- */
let lastInput = -1e12;
function doBuy(k) {
  if (k === 'hero') return buyHero();
  if (k.startsWith('ally')) return buyAlly(+k.slice(4));
  if (k.startsWith('skill')) return buySkill(+k.slice(5));
  if (k.startsWith('art_')) return buyArtifact(ARTIFACTS.find(a => 'art_' + a.id === k));
  if (k.startsWith('ach_')) return claimAch(ACH.find(a => 'ach_' + a.id === k));
  if (k.startsWith('quest_')) return claimQuest(k.slice(6));
  if (k.startsWith('eq_')) return upgradeEquip(k.slice(3));
  if (k.startsWith('it_')) return equipItem(+k.slice(3));
  if (k === 'questBonus') return claimQuestBonus();
  return false;
}
function bindEvents() {
  const markInput = () => { userActed = true; lastInput = performance.now(); audioInit(); };
  window.addEventListener('pointerdown', markInput, { passive: true });
  window.addEventListener('keydown', markInput);

  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    const r = cv.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    if (wisp) { const p = wispPos(); if (Math.hypot(p.x - x, p.y - y) < 40) { catchWisp(); return; } }
    doTap(x, y, false);
  });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('keydown', e => {
    if (!$('#modal').hidden || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '')) return;
    if (e.code === 'Space' || e.code === 'Enter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      e.preventDefault();
      if (e.repeat) return;                 // segurar a tecla não conta como vários toques
      const m = scene.monster();
      doTap(m.x + (Math.random() - 0.5) * m.r, m.y + (Math.random() - 0.5) * m.r, false);
    } else if (/^(Digit|Numpad)[1-4]$/.test(e.code) && !e.repeat && !e.ctrlKey && !e.metaKey && !e.altKey) useSkill(+e.code.slice(-1) - 1);
  });
  $('#tabs').addEventListener('click', e => {
    if (e.target.closest('#panelToggle')) { setPanelCollapsed(!S.settings.panelCollapsed); return; }
    const b = e.target.closest('[data-tab]'); if (!b) return;
    if (S.settings.panelCollapsed) setPanelCollapsed(false);
    tab = b.dataset.tab;
    document.querySelectorAll('#tabs [data-tab]').forEach(x => x.classList.toggle('on', x === b));
    structDirty = true;
    try { localStorage.setItem('laminaRunica.tab', tab); } catch (err) {}
  });
  $('#qty').addEventListener('click', e => {
    const b = e.target.closest('[data-qty]'); if (!b) return;
    S.settings.buyQty = b.dataset.qty === 'max' ? 'max' : +b.dataset.qty;
    document.querySelectorAll('#qty button').forEach(x => x.classList.toggle('on', x === b));
    uiDirty = true; saveSoon();
  });

  // compra com clique, ou segurando o botão para repetir
  let holdTimer = null, holdRepeat = null, holdFired = false;
  const stopHold = () => { clearTimeout(holdTimer); clearInterval(holdRepeat); holdTimer = holdRepeat = null; };
  $('#list').addEventListener('pointerdown', e => {
    const b = e.target.closest('[data-buy]'); if (!b || b.disabled) return;
    const k = b.dataset.buy;
    if (k === 'prestige' || k.startsWith('ach_') || k.startsWith('quest') || k.startsWith('it_')) return;
    holdFired = false;
    stopHold();
    holdTimer = setTimeout(() => {
      holdFired = true;
      holdRepeat = setInterval(() => { if (!doBuy(k)) stopHold(); updateList(); updateHUD(); }, 110);
    }, 380);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => $('#list').addEventListener(ev, stopHold));
  $('#list').addEventListener('scroll', stopHold, { passive: true });
  $('#list').addEventListener('click', e => {
    if (e.target.closest('[data-daily]')) { claimDaily(); updateList(); return; }
    const rr = e.target.closest('[data-reroll]'); if (rr) { openReroll(+rr.dataset.reroll); return; }
    const sv = e.target.closest('[data-salvage]'); if (sv) { salvageItem(+sv.dataset.salvage); return; }
    if (e.target.closest('[data-salvagecommon]')) { salvageCommons(); return; }
    const b = e.target.closest('[data-buy]'); if (!b) return;
    if (holdFired) { holdFired = false; return; }
    if (b.disabled) return;
    const k = b.dataset.buy;
    if (k === 'prestige') openPrestige(); else doBuy(k);
    updateList(); updateHUD();
  });
  $('#skills').addEventListener('click', e => {
    const b = e.target.closest('[data-skill]'); if (!b) return;
    const i = +b.dataset.skill;
    if (S.skills[i].lvl < 1) { toast(`Aprenda ${SKILLS[i].name} na aba Poderes.`); return; }
    useSkill(i);
  });
  $('#btnBoss').addEventListener('click', challengeBoss);
  $('#loot').addEventListener('click', e => {
    const eqb = e.target.closest('[data-lootequip]');
    if (eqb) { equipItem(+eqb.dataset.lootequip); return; }
    if (e.target.closest('[data-lootclose]')) hideLoot();
  });
  $('#btnSettings').addEventListener('click', openSettings);
  $('#modal').addEventListener('click', e => {
    if (e.target.id === 'modal' || e.target.closest('[data-close]')) closeModal();
  });
  window.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
  $('#btnMute').addEventListener('click', () => { S.settings.sound = !S.settings.sound; if (S.settings.sound) audioInit(); syncMute(); save(); toast(S.settings.sound ? 'Som ligado.' : 'Som desligado.'); });
  $('#saveWarn').addEventListener('click', openSaveProblem);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { save(); cloudSave(); }
    else lastTick = performance.now();
  });
  window.addEventListener('pagehide', () => save());
  window.addEventListener('beforeunload', () => save());
  // Outra aba gravou uma revisão mais nova: esta aba para de salvar na hora, em vez de esperar o próximo autosave.
  window.addEventListener('storage', e => {
    if (e.key !== SAVE_KEY || saveBlock) return;
    if (e.newValue === null) { enterConflict(); return; }
    const m = peekSave(e.newValue);
    if (m.valid && m.tab && m.tab !== Session.tab && m.rev > Session.knownRev) enterConflict();
  });

  if ('ResizeObserver' in window) new ResizeObserver(() => scene.resize()).observe(cv);
  else window.addEventListener('resize', () => scene.resize());
}

/* =========================================================
   LOOP PRINCIPAL
   ========================================================= */
let lastTick = performance.now();
let uiTimer = 0, furyAcc = 0, paused = false;
let wallLast = Date.now();

function step(dt) {
  S.clock += dt;
  S.stats.open += dt;
  if (performance.now() - lastInput < ACTIVE_WINDOW) S.stats.active += dt;   // só conta se você tocou recentemente
  S.mana = Math.min(manaMax(), S.mana + manaRegen() * dt);
  combo.t += dt;
  if (combo.t > 0.6 && combo.n) combo.n = 0;
  if (hero.atk > 0) hero.atk -= dt;
  if (hero.win > 0) hero.win -= dt;
  if (hero.hurt > 0) hero.hurt -= dt;
  if (shakeT > 0) { shakeT -= dt; if (shakeT <= 0) shakeA = 0; }
  if (flashT > 0) flashT = Math.max(0, flashT - dt);

  if (wisp) {
    wisp.t += dt; wisp.x += wisp.dir * wisp.speed * dt;
    if (wisp.x < -40 || wisp.x > W + 40) { wisp = null; nextWisp = wispInterval(); }
  } else {
    nextWisp -= dt;
    if (nextWisp <= 0) spawnWisp();
  }

  if (spawnDelay > 0) {
    spawnDelay -= dt;
    if (foe && foe.dead) foe.deathT += dt;
    if (spawnDelay <= 0) { spawnDelay = 0; spawn(false); }
    return;
  }
  if (!foe) { spawn(false); return; }
  foe.born += dt;
  if (foe.hit > 0) foe.hit -= dt;

  const d = dps();
  if (d > 0) damage(d * dt, 0, 0, null);
  if (foe.dead) return;

  if (skillActive(1)) {
    furyAcc += dt * 10;
    const m = scene.monster();
    while (furyAcc >= 1 && !foe.dead) { furyAcc -= 1; doTap(m.x + (Math.random() - 0.5) * m.r, m.y + (Math.random() - 0.4) * m.r, true); }
  } else furyAcc = 0;

  if (foe.boss && !foe.dead) {
    foe.timer -= dt;
    if (foe.timer <= 0) bossEscaped();
  }
}

function frame(now) {
  let dt = (now - lastTick) / 1000;
  lastTick = now;
  // compensa o tempo em que a aba ficou em segundo plano (o navegador pausa a animação)
  const wnow = Date.now(), gap = (wnow - wallLast) / 1000;
  wallLast = wnow;
  if (gap > 5 && !paused) { offlineGains(gap, gap >= 60); save(); }
  if (dt > 1) dt = 1;
  if (dt < 0) dt = 0;
  if (!paused) step(dt);
  if (S.stage !== scene.stageKey) scene.zoneChanged();
  render(now / 1000, dt);

  uiTimer -= dt;
  if (uiTimer <= 0 || uiDirty) {
    uiTimer = 0.2;
    if (structDirty) buildList(); else updateList();
    updateHUD();
    uiDirty = false;
  }
  updateFoeUI(false);
  if (tab === 'itens' && !S.settings.panelCollapsed) drawPreview(now / 1000);
  if (foe && $('#foeName').dataset.seed !== String(foe.seed)) { $('#foeName').dataset.seed = foe.seed; updateFoeUI(true); }

  if (!saveBlock && (now - lastSaveAt) / 1000 >= S.settings.autosave) save();
  if (cloud.ok && !saveBlock && now - cloud.last > 30000) cloudSave();
  requestAnimationFrame(frame);
}

/* =========================================================
   INÍCIO
   ========================================================= */
function start(hotData) {
  Store.init();
  let fresh = false, hot = false, pending = null;
  const hr = hotData && hotData.save ? decodeSave(hotData.save) : null;
  if (hr && hr.ok) { S = hr.state; Session.knownRev = hr.meta.rev || 0; hot = true; }
  else {
    const L = chooseLoad();
    if (L.kind === 'ok' || L.kind === 'backup') {
      S = L.res.state; Session.knownRev = L.res.meta.rev || 0;
      if (L.kind === 'backup') {
        if (Store.get(CORRUPT_KEY) !== L.mainText) Store.set(CORRUPT_KEY, L.mainText);
        const pm = peekSave(L.mainText);
        if (pm.rev) Session.knownRev = Math.max(Session.knownRev, pm.rev);
        pending = () => openModal(`<h2>Progresso recuperado</h2>
          <p>O salvamento principal não pôde ser lido (${esc(SAVE_ERRORS[L.mainError] || L.mainError)}), então o <b>backup</b> mais recente foi carregado.
          Uma cópia do salvamento danificado foi guardada neste navegador e pode ser exportada.</p>
          ${summaryCard('Backup carregado', saveSummary(S))}
          <div class="btns"><button class="btn primary" data-close>Continuar</button><button class="btn" id="dumpBtn">Exportar dados brutos</button></div>`,
          sh => sh.querySelector('#dumpBtn').addEventListener('click', () => downloadText(`lamina-runica-dados-${stamp()}.txt`, rawDump())));
      }
      if (L.res.fixes.length) {
        writeSafety('repair', L.text);                   // o original fica guardado antes de ser regravado
        setTimeout(() => toast(`Alguns valores inválidos do save foram corrigidos (${L.res.fixes.join(', ')}). O original ficou guardado nas Configurações.`, 'bad'), 900);
      }
    } else if (L.kind === 'fresh') fresh = true;
    else if (L.kind === 'future') pending = () => openFuture(L);
    else pending = () => openRecovery(L);
    if (L.kind === 'future') saveBlock = 'future';
    if (L.kind === 'recover') saveBlock = 'recover';
  }
  if (!Store.backend) { storageOk = false; lastSaveError = 'unavailable'; }
  try { const t = localStorage.getItem('laminaRunica.tab'); if (TABS.some(x => x.id === t)) tab = t; } catch (e) {}

  buildTabs(); buildSkillBar(); bindEvents();
  applyA11y(); syncMute();
  scene.resize();
  spawn(false);

  if (!fresh && !hot && !saveBlock) {
    const now = Date.now();
    if (S.wallMax > now + 24 * 3600 * 1000) S.wallMax = now;           // horário registrado absurdo (relógio adiantado demais)
    if (S.wallMax > now + 60000) setTimeout(() => toast('O relógio do aparelho voltou no tempo. O progresso offline volta a contar a partir do último horário registrado.', 'bad'), 1200);
    const away = offlineSeconds(now, S.lastSave, S.wallMax);
    if (away > 0) offlineGains(away, !pending);
    save();                                                              // o período offline nunca é aplicado duas vezes
  }
  if (!Store.backend) setTimeout(() => { toast('⚠ ' + SAVE_FAIL_TXT.unavailable, 'bad'); setSaveWarn('unavailable'); }, 800);
  if (pending) pending();
  else if (fresh) {
    dailyPrompted = false;
    openModal(`<h2>Lâmina Rúnica</h2>
      <p>Toque nos monstros para atacar. Derrote 10 monstros e enfrente o chefe antes que o tempo acabe.</p>
      <p>Use o ouro para subir o nível do herói, contratar criaturas místicas que lutam sozinhas e aprender poderes. Toque nos espíritos que passam voando para ganhar prêmios.</p>
      <p>Chefes podem soltar equipamentos (espada, chapéu, roupa e anel) que mudam a aparência do herói. A cada 10 estágios aparece um Chefe Ancestral, que sempre solta um item. A partir do estágio ${PRESTIGE_STAGE}, renasça para ganhar essências e ficar mais forte para sempre. Seu progresso é salvo automaticamente.</p>
      <div class="btns"><button class="btn primary" data-close>Começar</button></div>`);
    save();
  } else if ($('#modal').hidden) {
    openDaily();
  }
  try { window.claude?.hot?.snapshot?.(() => ({ save: serialize() })); } catch (e) {}
  // Ganchos de teste: só existem com #teste no endereço. Não dão poder que o próprio navegador já não dê ao jogador.
  if (location.hash === '#teste') window.__lr = { get S() { return S; }, spawnWisp, wispPos, get wisp() { return wisp; }, rollRarity, makeItem, grantItem, bossDrop, equipItem,
    save, Session, Store, get saveBlock() { return saveBlock; }, get foe() { return foe; }, killFoe, bossEscaped, challengeBoss, prestige, salvageItem, claimQuest, claimDaily, claimAch, ACH, exportCode, tryImport, doTap };
  lastTick = performance.now();
  requestAnimationFrame(frame);
  cloudInit();
}

try {
  const H0 = window.claude && window.claude.hot;
  if (H0 && H0.ready) H0.ready(start); else start((H0 && H0.data) || {});
} catch (e) { start({}); }
})();
</script>
