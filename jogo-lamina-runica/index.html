<!doctype html>
<html lang="pt-BR" class="standalone">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ARTIFACT-START -->
<title>Lâmina Rúnica</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#141225">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: uma coluna de jogo — barra de recursos, cena de batalha (maior), barra de poderes e painel de abas recolhível */
:root {
  --ink: #141225;
  --panel: #1d1a33;
  --panel-2: #27224a;
  --line: #3b3466;
  --text: #f4effd;
  --muted: #a99fcf;
  --gold: #ffc94a;
  --gold-deep: #c9871c;
  --mana: #55c8ff;
  --hp: #ff5d6c;
  --ok: #7ee08a;
  --essence: #c58bff;
  --danger: #ff6b5a;
  --f-display: 'Bungee', 'Impact', 'Arial Black', system-ui, sans-serif;
  --f-body: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--ink); color: var(--text);
  font-family: var(--f-body); font-size: 14px;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
.standalone body { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

#app { height: 100%; max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; position: relative; background: var(--ink); }

/* ---------- barra superior ---------- */
#top { display: flex; align-items: center; gap: 10px; padding-block: 6px; background: var(--panel); border-bottom: 1px solid var(--line); }
.res { display: flex; align-items: center; gap: 6px; font-family: var(--f-display); font-size: 17px; font-variant-numeric: tabular-nums; min-width: 0; }
.res svg { flex: 0 0 auto; width: 22px; height: 22px; }
.res.gold { color: var(--gold); flex: 1 1 0; }
.res.ess { color: var(--essence); font-size: 15px; }
.stageBox { flex: 1 1 0; text-align: center; min-width: 0; }
.stageBox .zone { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stageBox .stage { font-family: var(--f-display); font-size: 15px; }
.pips { display: flex; justify-content: center; gap: 3px; margin-top: 3px; }
.pips i { width: 8px; height: 4px; border-radius: 2px; background: var(--line); }
.pips i.on { background: var(--gold); }
.pips i.boss { width: 12px; background: #5a2a3a; }
.pips i.boss.on { background: var(--hp); }
.iconBtn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); display: grid; place-items: center; flex: 0 0 auto; padding: 0; }
.iconBtn svg { width: 20px; height: 20px; }

/* ---------- cena ---------- */
#scene { position: relative; flex: 1 1 auto; min-height: 200px; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
#foe { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: min(62%, 360px); pointer-events: none; text-align: center; }
.foeName { font-family: var(--f-display); font-size: 14px; text-shadow: 0 2px 0 rgba(0,0,0,.5); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.foeName.boss { color: #ffb0b8; }
.bar { position: relative; height: 16px; border-radius: 8px; background: rgba(10,8,25,.75); border: 1px solid rgba(255,255,255,.18); overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; width: 100%; border-radius: 8px; }
.bar.hp > i { background: linear-gradient(180deg, #ff8a95, var(--hp)); transition: width .08s linear; }
.bar > span { position: relative; display: block; font-size: 11px; font-weight: 900; line-height: 14px; text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; }
.bar.timer { height: 13px; margin-top: 4px; }
.bar.timer > span { font-size: 10px; line-height: 11px; }
.bar.timer.urgent { border-color: var(--danger); animation: urgent .5s ease-in-out infinite alternate; }
@keyframes urgent { to { box-shadow: 0 0 12px rgba(255,93,108,.8); } }
.stack { display: flex; flex-direction: column; line-height: 1.05; min-width: 0; }
.stack small { font: 800 10px var(--f-body); color: var(--muted); white-space: nowrap; }
.wave { font: 800 10px var(--f-body); color: var(--muted); margin-left: 4px; }
#loot { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); width: min(92%, 360px); z-index: 20; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; background: rgba(20,18,37,.96); border: 2px solid var(--rc, var(--line)); box-shadow: 0 0 22px -4px var(--rc, transparent); animation: lootIn .35s cubic-bezier(.2,1.4,.4,1); }
#loot .info .t { color: var(--rc); }
#loot .lootBtns { display: flex; flex-direction: column; gap: 4px; }
#loot .btn { padding: 6px 10px; font-size: 12px; }
@keyframes lootIn { from { transform: translateX(-50%) scale(.7); opacity: 0; } }
.itAv { border: 2px solid var(--rc); background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--rc) 35%, transparent), var(--ink)); }
.itAv svg { width: 26px; height: 26px; }
.rc { color: var(--rc); }
.mini { flex: 0 0 auto; border: 1px solid var(--line); background: var(--ink); color: var(--muted); border-radius: 10px; width: 40px; align-self: stretch; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; gap: 1px; padding: 2px; }
.mini svg { width: 16px; height: 16px; }
.cmp.up { color: var(--ok); font-weight: 900; }
.cmp.down { color: var(--danger); font-weight: 900; }
.equipCard { display: flex; gap: 12px; align-items: center; }
.equipCard canvas { width: 112px; height: 132px; flex: 0 0 auto; border-radius: 12px; background: radial-gradient(circle at 50% 35%, #3a3170, #141225); }
.eqSum { font-size: 12px; color: var(--muted); line-height: 1.5; min-width: 0; }
.eqSum b { color: var(--text); font-variant-numeric: tabular-nums; }
.odds { display: grid; grid-template-columns: 1fr auto auto; gap: 3px 12px; font-size: 12px; margin-top: 6px; font-variant-numeric: tabular-nums; }
.odds span:nth-child(3n+2), .odds span:nth-child(3n) { text-align: right; }
.odds .h { color: var(--muted); font-weight: 900; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; }
.dimStar { color: #4a4470; }
.bar.timer > i { background: linear-gradient(90deg, var(--danger), var(--gold)); }
#dpsTag { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); bottom: 8px; font-size: 11px; font-weight: 800; color: var(--muted); background: rgba(10,8,25,.6); padding: 4px 8px; border-radius: 8px; pointer-events: none; font-variant-numeric: tabular-nums; max-width: 62%; }
#dpsTag b { color: var(--text); }
#btnBoss { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); bottom: 8px; border: 0; border-radius: 12px; padding: 9px 14px; background: linear-gradient(180deg, #ff7d88, #c9334a); font-family: var(--f-display); font-size: 13px; box-shadow: 0 4px 0 #7a1d2c; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }
#saveDot { position: absolute; top: 10px; right: max(10px, env(safe-area-inset-right, 0px)); font-size: 10px; font-weight: 800; color: var(--ok); opacity: 0; transition: opacity .4s; pointer-events: none; }
#saveDot.show { opacity: .9; }
#saveWarn { position: absolute; top: 6px; right: max(10px, env(safe-area-inset-right, 0px)); z-index: 25; border: 1px solid var(--danger); background: rgba(40,8,12,.92); color: #ffc0b8; border-radius: 10px; padding: 6px 10px; font-size: 12px; font-weight: 900; }
#btnMute .cross { display: none; }
#btnMute.off .cross { display: inline; }
#btnMute.off .waves { display: none; }
#btnMute.off { color: var(--danger); }
.sumCard .stats { font-size: 12px; gap: 3px 10px; }
html.bigText #panel, html.bigText #skillbar, html.bigText #top, html.bigText .sheet { zoom: 1.14; }
html.lowMotion #btnBoss, html.lowMotion .bar.timer.urgent { animation: none; }

/* ---------- poderes ---------- */
#skillbar { background: var(--panel); border-top: 1px solid var(--line); padding-block: 6px; display: flex; flex-direction: column; gap: 5px; }
.mana { position: relative; height: 10px; border-radius: 5px; background: #0e0c20; overflow: hidden; }
.mana > i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #2a7fd6, var(--mana)); }
.mana > span { position: absolute; inset: 0; font-size: 9px; font-weight: 900; text-align: center; line-height: 10px; text-shadow: 0 1px 1px #000; }
.skills { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.skill { position: relative; height: 54px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 0; }
.skill svg { width: 22px; height: 22px; position: relative; z-index: 1; }
.skill small { position: relative; z-index: 1; font-size: 9.5px; font-weight: 900; color: var(--mana); }
.skill .nm { position: relative; z-index: 1; font-size: 10.5px; font-weight: 900; line-height: 1; display: flex; gap: 3px; align-items: center; }
.skill kbd { font: 800 8.5px var(--f-body); color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 2px; }
@media (hover: none) { .skill kbd { display: none; } }
.skill svg { width: 20px; height: 20px; }
.skill .cd { position: absolute; inset: 0; background: conic-gradient(rgba(5,4,15,.78) calc(var(--p, 0) * 1turn), transparent 0); }
.skill .cdTxt { position: absolute; z-index: 2; font-family: var(--f-display); font-size: 15px; text-shadow: 0 1px 3px #000; }
.skill.active { border-color: var(--gold); box-shadow: inset 0 0 14px rgba(255,201,74,.45); }
.skill.locked { opacity: .35; }
.skill.nomana small { color: var(--danger); }

/* ---------- painel ---------- */
#panel { flex: 0 0 44%; min-height: 0; display: flex; flex-direction: column; background: var(--panel); border-top: 1px solid var(--line); }
#panel.collapsed { flex: 0 0 auto; }
#panel.collapsed #qty, #panel.collapsed #list { display: none; }
#tabs { display: grid; grid-template-columns: repeat(6, 1fr) 34px; border-bottom: 1px solid var(--line); }
#tabs button { position: relative; border: 0; background: none; padding: 8px 0 6px; font-size: 10.5px; min-width: 0; font-weight: 800; color: var(--muted); border-bottom: 3px solid transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; }
#tabs button svg { width: 18px; height: 18px; }
#tabs button.on { color: var(--gold); border-bottom-color: var(--gold); }
#tabs button.has::after { content: ""; position: absolute; top: 5px; right: calc(50% - 16px); width: 8px; height: 8px; border-radius: 50%; background: var(--hp); box-shadow: 0 0 0 2px var(--panel); }
#tabs #panelToggle { justify-content: center; }
#panelToggle svg { transition: transform .2s; }
#panel.collapsed #panelToggle svg { transform: rotate(180deg); }
#qty { display: flex; gap: 6px; justify-content: flex-end; padding-block: 5px 2px; }
#qty button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 3px 10px; font-size: 12px; font-weight: 900; color: var(--muted); }
#qty button.on { background: var(--gold); color: #3a2400; border-color: var(--gold); }
#list { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 12px; display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
.row { display: flex; align-items: center; gap: 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px; }
.row.locked { opacity: .45; }
.row.best { border-color: var(--ok); }
.av { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-family: var(--f-display); font-size: 18px; color: #160f2a; overflow: hidden; }
.av svg { width: 24px; height: 24px; }
.av img { width: 44px; height: 44px; display: block; }
.av.reroll { position: relative; cursor: pointer; padding: 0; border: 0; }
.av.reroll::after { content: "↻"; position: absolute; right: 2px; bottom: 0; font: 900 12px var(--f-body); color: #fff; text-shadow: 0 1px 2px #000; }
.info { flex: 1 1 auto; min-width: 0; }
.info .t { font-weight: 900; font-size: 14px; line-height: 1.25; }
.info .t em { font-style: normal; color: var(--gold); font-variant-numeric: tabular-nums; }
.info .s { font-size: 12px; color: var(--muted); line-height: 1.3; }
.info .s b { color: var(--text); font-variant-numeric: tabular-nums; }
.chip { display: inline-block; font-size: 10px; font-weight: 900; color: #0f2a14; background: var(--ok); border-radius: 6px; padding: 1px 5px; margin-left: 4px; vertical-align: 1px; }
.stars { color: var(--gold); letter-spacing: 1px; }
.evo { color: var(--essence); font-weight: 900; }
.buy { flex: 0 0 auto; min-width: 92px; border: 0; border-radius: 10px; padding: 6px 8px; background: linear-gradient(180deg, #ffd977, var(--gold)); color: #3a2400; box-shadow: 0 3px 0 var(--gold-deep); display: flex; flex-direction: column; align-items: center; line-height: 1.15; touch-action: manipulation; }
.buy .a { font-size: 11px; font-weight: 900; }
.buy .b { font-family: var(--f-display); font-size: 13px; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 3px; }
.buy .b svg { width: 13px; height: 13px; }
.buy.ess { background: linear-gradient(180deg, #dcb2ff, var(--essence)); color: #2a0f45; box-shadow: 0 3px 0 #7a46a8; }
.buy:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--gold-deep); }
.buy[disabled] { background: #3a355c; color: #8a83ad; box-shadow: 0 3px 0 #23203d; cursor: default; }
.card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.card h3 { margin: 0 0 4px; font-family: var(--f-display); font-weight: 400; font-size: 15px; color: var(--essence); }
.card h3.gold { color: var(--gold); }
.card p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.4; }
.card .btns { margin-top: 8px; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; }
.days span { text-align: center; font-size: 10px; font-weight: 900; padding: 5px 0; border-radius: 6px; background: var(--ink); color: var(--muted); }
.days span.done { background: var(--gold-deep); color: #2a1800; }
.days span.today { outline: 2px solid var(--gold); color: var(--gold); }
.stats { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 13px; margin: 0; }
.stats dt { color: var(--muted); }
.stats dd { margin: 0; font-weight: 900; text-align: right; font-variant-numeric: tabular-nums; }
.sectionLabel { font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }

/* ---------- avisos e janelas ---------- */
#toasts { position: absolute; left: 0; right: 0; top: 74px; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 30; }
.toast { background: rgba(20,18,37,.94); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; font-weight: 800; font-size: 13px; max-width: 90%; text-align: center; animation: toastIn .25s ease-out; }
.toast.gold { border-color: var(--gold); color: var(--gold); }
.toast.bad { border-color: var(--danger); color: #ffc0b8; }
@keyframes toastIn { from { transform: translateY(-8px); opacity: 0; } }
#modal { position: absolute; inset: 0; z-index: 40; background: rgba(6,5,16,.72); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-height: 88%; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 18px 18px 0 0; padding-block: 16px 22px; display: flex; flex-direction: column; gap: 12px; }
.sheet h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 20px; text-wrap: balance; }
.sheet p { margin: 0; color: var(--muted); line-height: 1.45; }
.sheet .big { font-family: var(--f-display); font-size: 26px; color: var(--gold); }
.setRow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.setRow label { font-weight: 800; }
.setRow small { display: block; color: var(--muted); font-weight: 600; font-size: 11px; }
.switch { appearance: none; -webkit-appearance: none; width: 46px; height: 26px; border-radius: 13px; background: var(--line); position: relative; flex: 0 0 auto; cursor: pointer; transition: background .15s; margin: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--text); transition: transform .15s; }
.switch:checked { background: var(--ok); }
.switch:checked::after { transform: translateX(20px); }
select, input[type=range] { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; font-weight: 700; }
input[type=range] { padding: 0; width: 130px; accent-color: var(--gold); }
textarea { width: 100%; min-height: 84px; background: #0e0c20; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; resize: vertical; user-select: text; -webkit-user-select: text; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 9px 14px; font-weight: 900; }
.btn.primary { background: var(--gold); color: #3a2400; border-color: var(--gold); }
.btn.purple { background: var(--essence); color: #2a0f45; border-color: var(--essence); }
.btn.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: #2a0806; }
.btn[disabled] { opacity: .45; cursor: default; }
.fileLbl { position: relative; overflow: hidden; }
.fileLbl input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.muted { color: var(--muted); font-size: 12px; }
.cloudOn { color: var(--ok); font-weight: 900; }

/* Telas largas e celular deitado: batalha à esquerda, painel à direita (a cena deixa de ser espremida) */
@media (min-width: 760px) and (min-aspect-ratio: 5/4), (orientation: landscape) and (max-height: 540px) {
  #app { max-width: 1400px; display: grid; grid-template-columns: minmax(0, 1fr) clamp(300px, 36vw, 440px); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "top panel" "scene panel" "skill panel"; }
  #top { grid-area: top; } #scene { grid-area: scene; min-height: 0; } #skillbar { grid-area: skill; }
  #panel { grid-area: panel; border-top: 0; border-left: 1px solid var(--line); min-height: 0; }
  #app:has(#panel.collapsed) { grid-template-columns: minmax(0, 1fr) 0; }
  #app:has(#panel.collapsed) #panel { border: 0; overflow: visible; }
  #app:has(#panel.collapsed) #tabs { position: absolute; right: 0; top: 50%; width: 44px; grid-template-columns: 1fr; background: var(--panel); border: 1px solid var(--line); border-radius: 12px 0 0 12px; z-index: 5; transform: translateY(-50%); }
  #app:has(#panel.collapsed) #tabs [data-tab] { display: none; }
  #panel.collapsed #panelToggle svg { transform: rotate(90deg); }
  #panelToggle svg { transform: rotate(-90deg); }
}
@media (orientation: landscape) and (max-height: 540px) {
  #top { padding-block: 3px; }
  .skill { height: 44px; } .skill small { display: none; }
  #skillbar { padding-block: 4px; gap: 3px; }
}
@media (prefers-reduced-motion: reduce) {
  #btnBoss, #loot, .bar.timer.urgent { animation: none; }
  .toast { animation: none; }
}
</style>
</head>
<body>
<div id="app">
  <header id="top" class="gutter">
    <div class="res gold" aria-label="Ouro">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#ffc94a"/><circle cx="12" cy="12" r="7" fill="none" stroke="#c9871c" stroke-width="2"/><path d="M12 8v8M9.5 10.5h5" stroke="#c9871c" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="stack"><b id="goldTxt">0</b><small id="gpsTxt"></small></span>
    </div>
    <div class="stageBox">
      <div class="zone" id="zoneTxt">Campos de Âmbar</div>
      <div class="stage">Estágio <span id="stageTxt">1</span><span class="wave" id="waveTxt"></span></div>
      <div class="pips" id="pips"></div>
    </div>
    <div class="res ess" aria-label="Essências">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l7 7-7 13L5 9z" fill="#c58bff"/><path d="M5 9h14M12 2l-3 7 3 13 3-13z" fill="none" stroke="#7a46a8" stroke-width="1.4" stroke-linejoin="round"/></svg>
      <b id="essTxt">0</b>

function defaults() {
  return {
    v: VERSION, created: Date.now(), lastSave: Date.now(), wallMax: Date.now(), clock: 0,

      active: 0, open: 0, offline: 0, rerolls: 0, quests: 0, items: 0, legend: 0 },

      sound: true, volume: 0.6, vibrate: true, dmgNums: true, particles: true, shake: true,

      musicVol: 0.6, reduceMotion: false, bigText: false,
    },
  };

function merge(def, src) {
  if (src === undefined || src === null) return def;
  if (Array.isArray(def)) {
    if (!Array.isArray(src)) return def;
    return def.map((d, i) => (i < src.length ? merge(d, src[i]) : d));
  }
  if (typeof def === 'object' && def !== null) {
    if (typeof src !== 'object' || Array.isArray(src)) return def;
    const out = { ...def };
    const open = Object.keys(def).length === 0;   // objeto livre (artefatos, conquistas)
    for (const k of Object.keys(src)) {
      if (k in def) out[k] = merge(def[k], src[k]);
      else if (open && typeof src[k] === 'number' && isFinite(src[k])) out[k] = src[k];
    }
    return out;
  }
  if (typeof def === 'number') return (typeof src === 'number' && isFinite(src)) ? src : def;
  if (typeof src !== typeof def) return def;
  return src;
}

/* ---------- migrações ----------
   Cada entrada leva o save da versão (n-1) para n. Campos novos vêm de defaults() via merge();
   aqui só entram transformações reais. Nenhuma migração altera ouro, níveis, itens ou quantidades. */
const MIGRATIONS = {
  2: raw => { if (raw.stats && typeof raw.stats === 'object') delete raw.stats.time; },  // v1 somava o tempo offline ao tempo de jogo
  3: () => {},                                                                            // v3 e v4 só acrescentaram campos
  4: () => {},
  5: raw => { if (!(+raw.wallMax > 0)) raw.wallMax = +raw.lastSave || 0; },               // v5: maior horário já registrado
};
function migrate(raw) {
  const from = Math.max(1, Math.floor(+raw.v) || 1);
  for (let t = from + 1; t <= VERSION; t++) if (MIGRATIONS[t]) MIGRATIONS[t](raw);
  raw.v = VERSION;
  return raw;
}

const clampN = (v, a, b) => Math.max(a, Math.min(b, v));
function itemName(it) { return `${SLOT_DEF[it.slot].models[it.model]} ${ITEM_SUFFIX[it.rar]}`; }
function fragValue(it) { return RARITIES[it.rar].frag * (1 + Math.floor(it.lvl / 25)) + it.up * 2; }
function sanitizeItem(it) {
  if (!it || typeof it !== 'object' || !Object.prototype.hasOwnProperty.call(SLOT_DEF, it.slot)) return null;
  const out = {
    id: Math.floor(+it.id) || 0, slot: it.slot, rar: clampN(Math.floor(+it.rar || 0), 0, RARITIES.length - 1),
    lvl: clampN(Math.floor(+it.lvl || 1), 1, 1e6), up: clampN(Math.floor(+it.up || 0), 0, 1e4),
    model: Math.abs(Math.floor(+it.model || 0)) % SLOT_DEF[it.slot].models.length, hue: Math.abs(Math.floor(+it.hue || 0)) % 360,
    ex: !!it.ex, sec: null, name: '',
  };
  if (it.sec && SECONDARY.some(x => x.type === it.sec.type) && isFinite(+it.sec.val)) out.sec = { type: it.sec.type, val: clampN(+it.sec.val, 0, 1e4) };
  out.name = itemName(out);        // o nome é sempre recalculado: texto do save nunca chega ao HTML
  return out;
}

// Corrige apenas valores impossíveis (negativos, fora do intervalo, ids desconhecidos). Saves legítimos passam intactos.
function sanitizeState(m, raw, fixes) {
  const num = (o, k, lo, hi, int, label) => {
    const v0 = o[k];
    let v = typeof v0 === 'number' && isFinite(v0) ? v0 : lo;
    if (int) v = Math.floor(v);
    v = clampN(v, lo, hi);
    if (v !== v0) { o[k] = v; fixes.push(label || k); }
  };
  num(m, 'gold', 0, MAX_NUM, false);
  num(m, 'stage', 1, 1e6, true); num(m, 'wave', 0, WAVES - 1, true);
  num(m, 'runMaxStage', m.stage, 1e6, true); num(m, 'maxStage', m.runMaxStage, 1e6, true);
  num(m, 'farmKills', 0, 1e9, true); num(m, 'hero', 1, 1e7, true);
  m.allies.forEach((_, i) => num(m.allies, i, 0, 1e7, true, 'allies'));
  m.allyForms.forEach(f => { num(f, 'sp', 0, SPECIES.length - 1, true, 'allyForms'); num(f, 'hue', 0, 359, true, 'allyForms'); });
  for (const k of Object.keys(m.arts)) {

    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;

    if (snap.exists) {
      const d = snap.data() || {};
      const text = typeof d.save === 'string' ? d.save : '';
      const r = decodeSave(text);

        const localFresh = S.maxStage <= 2 && S.prestiges === 0 && S.essTotal === 0 && S.stats.taps < 200;
        if (localFresh && !saveBlock) { useCloud(r.state, text); return; }

    ${summaryCard('Deste aparelho', a)}${summaryCard('Da nuvem (sua conta)', b)}
    <div class="btns"><button class="btn primary" id="useCloud">Usar o da nuvem</button><button class="btn" id="keepLocal">Manter o deste aparelho</button></div>`,
    sh => {

/* =========================================================
   MONSTROS
   ========================================================= */
let foe = null;
let spawnDelay = 0;

function makeName(r, boss) {
  const n = NAME_A[Math.floor(r() * NAME_A.length)] + NAME_B[Math.floor(r() * NAME_B.length)];
  return boss ? `${n}, ${BOSS_T[Math.floor(r() * BOSS_T.length)]}` : n;
}

function spawn(forceBoss) {
  const boss = forceBoss || (S.wave >= WAVES - 1 && !S.bossFailed);
  const seed = (S.stage * 7919 + S.wave * 104729 + Math.floor(Math.random() * 1e6)) >>> 0;
  const r = rng(seed);
  const chest = !boss && S.stage >= 3 && Math.random() < 0.03;
  const ancient = boss && S.stage % 10 === 0;
  const shiny = !boss && !chest && Math.random() < 0.02;      // variante rara: só aparência, mesma recompensa
  const zone = zoneOf(S.stage);
  let hp = hpFor(S.stage);
  if (boss) hp *= 6;
  if (ancient) hp *= 1.6;
  if (chest) hp *= 0.6;
  foe = {
    boss, chest, ancient, seed, hp, maxHp: hp,
    shiny, name: chest ? 'Baú Vivo' : ancient ? makeName(r, false) + ', o Ancestral' : (shiny ? '✦ ' : '') + makeName(r, boss),
    hue: (zone.hue + (r() - 0.5) * 140 + 360) % 360,
    lobes: 3 + Math.floor(r() * 5), phase: r() * 6.28, amp: 0.05 + r() * 0.09,
    eyes: boss ? 2 + Math.floor(r() * 2) : 1 + Math.floor(r() * 3),
    horns: boss || r() < 0.55, hornLen: 0.35 + r() * 0.35, spikes: r() < 0.4, sat: 55 + r() * 30,
    born: 0, hit: 0, dead: false, deathT: 0, timer: boss ? bossTime() : 0,
  };
  if (boss) { SFX.boss(); vibrate(40); moment.boss = { t: 0, ancient }; }
  updateFoeUI(true);
}

function killFoe() {

function rarityWeights(ancient) {
  const w = RARITIES.map(r => ancient ? r.wa : r.w);
  const luck = 1 + S.pity * 0.025;              // sorte acumulada aumenta Lendário e Mítico
  w[4] *= luck; w[5] *= luck;
  return w;
}
function rollRarity(ancient) {
  if (S.pity >= PITY - 1) return Math.random() < 0.15 ? 5 : 4;
  const w = rarityWeights(ancient);
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < w.length; i++) { r -= w[i]; if (r <= 0) return i; }
  return 0;
}
function makeItem(slot, rar, lvl, ex) {
  const it = { id: S.nextItemId++, slot, rar, lvl, up: 0, ex: !!ex,
    model: Math.floor(Math.random() * SLOT_DEF[slot].models.length), hue: Math.floor(Math.random() * 360), sec: null };

    const pool = SECONDARY.filter(x => x.val(rar) > 0);

    it.sec = { type: sd.type, val: sd.val(rar) };

}

function itemCompare(it) {
  const cur = S.equip[it.slot];

  const ratio = (1 + itemMain(it) / 100) / (1 + itemMain(cur) / 100);
  const pct = Math.round((ratio - 1) * 100);
  if (Math.abs(pct) < 1) return { ratio, html: '<span class="cmp">= igual ao equipado</span>' };
  return { ratio, html: pct > 0 ? `<span class="cmp up">▲ ${fmtPlain(pct)}% mais forte</span>` : `<span class="cmp down">▼ ${fmtPlain(-pct)}% mais fraco</span>` };
}

  if (slot === 'armor') return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3l4 2 4-2 5 3-2 5-2-1v11H7V10l-2 1-2-5z" fill="${c}"/></svg>`;

}

const PENTA = [0, 3, 5, 7, 10, 12, 15, 17];
let musicStep = 0, musicPat = [];
function musicTick() {
  if (!AC || !S.settings.sound || !S.settings.music || document.hidden || AC.state !== 'running') return;
  const z = Math.floor((S.stage - 1) / 10) % ZONES.length;
  const root = 196 * Math.pow(2, [0, 2, -2, 3, 5, -3, 1, -5][z] / 12);
  const st = musicStep++ % 16;
  if (st === 0) musicPat = Array.from({ length: 16 }, (_, k) => (k % 2 === 0 || Math.random() < 0.3) && Math.random() < 0.75 ? PENTA[Math.floor(Math.random() * PENTA.length)] : -1);
  if (st % 8 === 0) tone(root / 2, 1.6, 'triangle', 0.07, 0, 0, 'music');
  if (st % 8 === 4) tone(root / 2 * Math.pow(2, 7 / 12), 1.2, 'triangle', 0.05, 0, 0, 'music');
  const n = musicPat[st];
  if (n >= 0) tone(root * Math.pow(2, n / 12), 0.35, 'sine', 0.045, 0, 0, 'music');
}
setInterval(musicTick, 240);

/* ---------- recompensa diária ---------- */
function dailyState() {
  const today = todayKey();
  if (S.daily.last === today) return { available: false, day: S.daily.streak };
  if (S.daily.last > today) return { available: false, day: S.daily.streak, clockBack: true };   // relógio voltou
  const y = new Date(); y.setDate(y.getDate() - 1);
  const day = S.daily.last === todayKey(y) ? (S.daily.streak % 7) + 1 : 1;
  return { available: true, day };
}
function dailyReward(day) {
  const gold = goldFor(Math.max(S.stage, 1)) * (25 * day) * goldBase();
  const ess = day === 7 ? 3 : day === 4 ? 1 : 0;
  return { gold, ess };
}
function claimDaily() {
  const st = dailyState();
  if (!st.available) return;
  const r = dailyReward(st.day);
  gainGold(r.gold);
  if (r.ess) { S.ess += r.ess; S.essTotal += r.ess; }
  S.daily = { last: todayKey(), streak: st.day };
  SFX.win(); vibrate([20, 40, 20]);
  toast(`Recompensa do dia ${st.day}: +${fmt(r.gold)} de ouro${r.ess ? ` e +${r.ess} essências` : ''}!`, 'gold');
  save(); uiDirty = true;
}
function dailyCardHTML(withButton) {
  const st = dailyState();
  const doneUpTo = st.available ? st.day - 1 : st.day;
  const r = dailyReward(st.available ? st.day : Math.min(7, st.day % 7 + 1));
  let days = '';
  for (let d = 1; d <= 7; d++) days += `<span class="${d <= doneUpTo ? 'done' : ''} ${st.available && d === st.day ? 'today' : ''}">Dia ${d}${d === 4 || d === 7 ? '◆' : ''}</span>`;
  return `<h3 class="gold">Recompensa diária</h3>
    <p>${st.available ? `Hoje é o <b>dia ${st.day}</b> da sua sequência: <b>+${fmt(r.gold)}</b> de ouro${r.ess ? ` e <b>+${r.ess}</b> essências` : ''}.` : 'Você já resgatou hoje. Volte amanhã para manter a sequência; se pular um dia, ela recomeça.'}</p>
    <div class="days">${days}</div>
    ${withButton && st.available ? '<div class="btns"><button class="btn primary" data-daily>Resgatar</button></div>' : ''}`;
}
let dailyPrompted = false;
function openDaily() {
  dailyPrompted = true;
  if (!dailyState().available) return;
  openModal(`<div class="card">${dailyCardHTML(false)}</div>
    <div class="btns"><button class="btn primary" id="okDaily">Resgatar</button><button class="btn" data-close>Depois</button></div>`,
    sh => sh.querySelector('#okDaily').addEventListener('click', () => { claimDaily(); closeModal(); }));
}

/* =========================================================
   PROGRESSO OFFLINE
   ========================================================= */
function offlineGains(seconds, showModal) {
  seconds = Math.min(seconds, OFFLINE_CAP);
  if (seconds < 5) return;
  S.clock += seconds;
  S.stats.offline += seconds;          // tempo fora NÃO conta como tempo jogando
  S.mana = Math.min(manaMax(), S.mana + manaRegen() * seconds);
  const d = dps(false);
  let gold = 0, kills = 0;
  if (d > 0) {
    const hp = hpFor(S.stage);
    kills = Math.floor(seconds / (hp / d + 0.4));
    gold = kills * goldFor(S.stage) * goldBase();
  }
  if (gold > 0) { gainGold(gold); S.stats.kills = addCapped(S.stats.kills, kills); }
  if (showModal && seconds >= 60 && S.settings.offlineModal) {
    openModal(`
      <h2>Bem-vindo de volta!</h2>
      <p>Você ficou fora por <b>${fmtTime(seconds)}</b>${seconds >= OFFLINE_CAP ? ' (limite de 12 h)' : ''}.</p>
      ${gold > 0
        ? `<p>Seus aliados derrotaram <b>${fmt(kills)}</b> monstros e coletaram:</p><div class="big">+${fmt(gold)} de ouro</div>`
        : `<p>Contrate aliados na aba <b>Aliados</b>: eles lutam e coletam ouro mesmo com o jogo fechado.</p>`}
      <div class="btns"><button class="btn primary" data-close>Continuar</button></div>`);
  } else if (gold > 0) {
    toast(`+${fmt(gold)} de ouro enquanto você estava fora`, 'gold');
  }
  uiDirty = true;
}

const cv = $('#cv');

const scene = {
  ground() { return H * 0.87; },

  monster() {

    const r = Math.min(W * 0.15, H * 0.22) * big;

  },
  heroPos() { return { x: W * 0.33, y: this.ground() }; },
  resize() {
    const rect = cv.getBoundingClientRect();
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = Math.max(1, rect.width); H = Math.max(1, rect.height);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    this.layout = wallLayout();
    this.zoneChanged();
  },
  zoneChanged() {
    const z = zoneOf(S.stage), zi = zoneIndex(S.stage);
    if (this.zoneIdx !== undefined && this.zoneIdx !== zi && this.stageKey !== undefined) moment.zone = { t: 0, name: z.name, idx: zi };
    this.zoneKey = z.name; this.zoneIdx = zi; this.stageKey = S.stage;
    const pr = rng(S.stage * 131 + 17);
    bgCanvas = document.createElement('canvas');
    bgCanvas.width = cv.width; bgCanvas.height = cv.height;
    const b = bgCanvas.getContext('2d');
    b.scale(DPR, DPR);
    const g = b.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, z.sky[0]); g.addColorStop(1, z.sky[1]);
    b.fillStyle = g; b.fillRect(0, 0, W, H);
    const r = rng(Math.floor((S.stage - 1) / 10) * 31 + 7);
    b.fillStyle = 'rgba(255,255,255,0.7)';
    for (let i = 0; i < 40; i++) { b.globalAlpha = r() * 0.6; b.fillRect(r() * W, r() * H * 0.5, 1.5, 1.5); }
    b.globalAlpha = 1;
    b.fillStyle = 'rgba(255,240,210,0.18)';
    b.beginPath(); b.arc(W * 0.82, H * 0.2, H * 0.1, 0, Math.PI * 2); b.fill();
    const layer = (color, base, amp, peaks) => {
      b.fillStyle = color; b.beginPath(); b.moveTo(0, H);
      const n = peaks * 2;
      for (let i = 0; i <= n; i++) {
        const x = (i / n) * W;

        b.lineTo(x, y);
      }
      b.lineTo(W, H); b.closePath(); b.fill();
    };
    layer(z.far, H * 0.64, H * 0.32, 5);
    drawZoneProps(b, zi, 'far', pr, W, H, this.ground());
    layer(z.near, H * 0.78, H * 0.15, 8);
    b.fillStyle = z.ground; b.fillRect(0, this.ground(), W, H);
    b.fillStyle = 'rgba(0,0,0,0.18)'; b.fillRect(0, this.ground(), W, 3);
    for (let i = 0; i < 30; i++) {
      b.fillStyle = `rgba(0,0,0,${0.05 + r() * 0.1})`;
      b.fillRect(r() * W, this.ground() + 6 + r() * (H - this.ground()), 4 + r() * 12, 2);
    }
    drawZoneProps(b, zi, 'near', pr, W, H, this.ground());
    drawWalls(b, z, this.layout || wallLayout());
    const vg = b.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.35, W / 2, H * 0.55, Math.max(W, H) * 0.8);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(5,3,15,0.45)');
    b.fillStyle = vg; b.fillRect(0, 0, W, H);
  },
};

/* ---------- cenário por região: adereços desenhados uma vez no fundo em cache ----------
   far = atrás da segunda camada de montanhas; near = sobre a linha do chão. r = gerador com semente do estágio. */
function zoneIndex(stage) { return Math.floor((stage - 1) / 10) % ZONES.length; }
function drawZoneProps(b, zi, layer, r, W, H, gy) {
  const tri = (x, y, w, h, col) => { b.fillStyle = col; b.beginPath(); b.moveTo(x - w / 2, y); b.lineTo(x, y - h); b.lineTo(x + w / 2, y); b.closePath(); b.fill(); };
  const glow = (x, y, rad, col) => { const g = b.createRadialGradient(x, y, 0, x, y, rad); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)'); b.fillStyle = g; b.fillRect(x - rad, y - rad, rad * 2, rad * 2); };

    if (layer === 'far') {

    } else {
      for (let x = 0; x < W; x += 5 * u) { const h = (8 + r() * 14) * u; b.strokeStyle = `hsla(${38 + r() * 14},80%,${45 + r() * 20}%,0.75)`; b.lineWidth = 1.4; b.beginPath(); b.moveTo(x, gy + 1); b.quadraticCurveTo(x + 2 * u, gy - h * 0.6, x + 3 * u, gy - h); b.stroke(); }
      for (let i = 0; i < 2; i++) { const x = W * (0.05 + r() * 0.9); b.fillStyle = '#b8862e'; b.beginPath(); b.ellipse(x, gy - 7 * u, 14 * u, 9 * u, 0, Math.PI, 0); b.fill(); b.fillRect(x - 14 * u, gy - 7 * u, 28 * u, 7 * u); b.strokeStyle = 'rgba(90,60,20,.6)'; b.beginPath(); b.moveTo(x - 10 * u, gy - 5 * u); b.lineTo(x + 10 * u, gy - 5 * u); b.stroke(); }
    }

    } else {

      for (let i = 0; i < 5; i++) { const x = W * (0.1 + r() * 0.8), s = (3 + r() * 3) * u; glow(x, gy - s, 14 * u, 'rgba(120,255,200,0.35)'); b.fillStyle = '#e8fff4'; b.fillRect(x - 1, gy - s, 2, s); b.fillStyle = '#7dffc8'; b.beginPath(); b.ellipse(x, gy - s, s * 1.4, s * 0.8, 0, Math.PI, 0); b.fill(); }
    }
  } else if (zi === 2) {                            // Pântano de Cinzas: árvores mortas, juncos, névoa
    if (layer === 'far') {
      b.strokeStyle = 'rgba(30,28,32,0.85)'; b.lineCap = 'round';
      for (let i = 0; i < 5; i++) {
        const x = W * (0.08 + r() * 0.84), y = H * 0.72, h = (50 + r() * 50) * u;
        b.lineWidth = 5 * u; b.beginPath(); b.moveTo(x, y); b.quadraticCurveTo(x + 8 * u, y - h * 0.5, x - 4 * u, y - h); b.stroke();
        b.lineWidth = 2.2 * u;
        for (let k = 0; k < 4; k++) { const by = y - h * (0.4 + k * 0.15), d = (k % 2 ? 1 : -1); b.beginPath(); b.moveTo(x, by); b.quadraticCurveTo(x + d * 14 * u, by - 6 * u, x + d * 22 * u, by - 18 * u); b.stroke(); }

      b.fillStyle = 'rgba(200,120,90,0.55)';
      b.beginPath(); b.moveTo(0, H * 0.74); for (let x = 0; x <= W; x += 10) b.lineTo(x, H * 0.74 - Math.sin(x / W * 5 + 1) * 14 * u - 10 * u); b.lineTo(W, H); b.lineTo(0, H); b.closePath(); b.fill();
    } else {
      for (let i = 0; i < 9; i++) { const x = r() * W, h = (6 + r() * 16) * u, hue = 170 + r() * 140; b.fillStyle = `hsla(${hue},80%,75%,0.75)`; b.beginPath(); b.moveTo(x - h * 0.3, gy + 1); b.lineTo(x + (r() - 0.5) * h * 0.4, gy - h); b.lineTo(x + h * 0.3, gy + 1); b.closePath(); b.fill(); b.fillStyle = 'rgba(255,255,255,0.8)'; b.fillRect(x - 0.5, gy - h * 0.7, 1, h * 0.4); }
    }
  } else if (zi === 5) {                            // Cavernas de Cristal: estalactites e aglomerados luminosos

    }

    if (layer === 'far') {

      const px = W * (0.2 + r() * 0.2), py = H * 0.22, pr = 34 * u;

      for (let i = 0; i < 70; i++) { b.globalAlpha = 0.3 + r() * 0.7; b.fillStyle = '#fff'; b.fillRect(r() * W, r() * H * 0.7, 1.2, 1.2); }
      b.globalAlpha = 1;
    } else {
      for (let i = 0; i < 3; i++) {
        const x = W * (0.15 + r() * 0.7), y = H * (0.3 + r() * 0.25), w = (26 + r() * 30) * u;
        b.fillStyle = '#241a4a'; b.beginPath(); b.moveTo(x - w, y); b.lineTo(x + w, y); b.lineTo(x + w * 0.3, y + w * 0.8); b.lineTo(x - w * 0.4, y + w * 0.6); b.closePath(); b.fill();
        b.fillStyle = '#3a2c70'; b.fillRect(x - w, y - 3 * u, w * 2, 4 * u);

      }

}

/* ---------- partículas ambientes por região (posições calculadas, nada é alocado por quadro) ---------- */
function drawAmbient(t) {
  if (!S.settings.particles) return;
  const zi = zoneIndex(S.stage), low = motionLow();
  const n = low ? 8 : 18, gy = scene.ground();
  const tt = low ? 0 : t;
  for (let i = 0; i < n; i++) {
    const ph = i * 97.31, a = (i * 0.618) % 1;
    let x, y, s = 2, col, alpha = 0.6;
    if (zi === 0) { x = (a * W + tt * (10 + i)) % W; y = gy - ((tt * (8 + i % 5 * 3) + ph) % (gy * 0.8)); col = '#ffe7a0'; alpha = 0.5; }
    else if (zi === 1) { x = a * W + Math.sin(tt * 0.7 + ph) * 30; y = gy * (0.45 + ((i * 0.37) % 0.5)) + Math.cos(tt * 0.9 + ph) * 20; col = '#b8ffb0'; alpha = 0.25 + 0.6 * Math.max(0, Math.sin(tt * 2 + ph)); s = 2.5; }
    else if (zi === 2) { x = (a * W - tt * (6 + i % 4)) % W; if (x < 0) x += W; y = gy - 10 - (i % 6) * 14 + Math.sin(tt + ph) * 4; col = '#c8d0c0'; alpha = 0.18; s = 3; }
    else if (zi === 3) { x = (a * W + Math.sin(tt + ph) * 16 + tt * 6) % W; y = (tt * (30 + i % 5 * 8) + ph) % H; col = '#ffffff'; alpha = 0.75; s = 2 + (i % 3) * 0.6; }
    else if (zi === 4) { x = (a * W + tt * (90 + i * 6)) % (W + 40) - 20; y = gy - 6 - (i % 7) * 10; col = '#ffd9a0'; alpha = 0.35; ctx.globalAlpha = alpha; ctx.fillStyle = col; ctx.fillRect(x, y, 10, 1.2); continue; }
    else if (zi === 5) { x = a * W; y = H * (0.1 + ((i * 0.53) % 0.75)); col = '#d9c2ff'; alpha = Math.max(0, Math.sin(tt * 2.5 + ph)) * 0.9; s = 2.2; }
    else if (zi === 6) { x = (a * W + Math.sin(tt * 2 + ph) * 10) % W; y = gy - ((tt * (25 + i % 4 * 9) + ph) % (gy * 0.9)); col = i % 2 ? '#ff7a3a' : '#ffc06a'; alpha = 0.7; s = 2; }
    else { x = a * W; y = H * ((i * 0.41) % 0.8); col = '#ffffff'; alpha = 0.3 + 0.7 * Math.abs(Math.sin(tt * 1.5 + ph)); s = 1.6; }
    ctx.globalAlpha = alpha; ctx.fillStyle = col; ctx.fillRect(x - s / 2, y - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
  if (zi === 7 && !low) {                       // cometa raro no Abismo
    const k = (t % 9) / 9;
    if (k < 0.12) { const cx = W * (1.1 - k * 8), cy = H * (0.05 + k * 2); ctx.strokeStyle = 'rgba(220,240,255,0.7)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + 40, cy - 14); ctx.stroke(); }
  }
}

/* ---------- momentos: transição de região e entrada de chefe (só canvas: não bloqueiam toques) ---------- */
const moment = { zone: null, boss: null };
function drawMoments(dt) {
  const low = motionLow();
  if (moment.zone) {
    const m = moment.zone; m.t += dt;
    const D = 2.4;
    if (m.t > D) moment.zone = null;
    else {
      const fade = low ? 0 : Math.max(0, 1 - m.t / 0.6);
      if (fade > 0) { ctx.fillStyle = `rgba(5,3,15,${fade * 0.9})`; ctx.fillRect(0, 0, W, H); }
      const a = Math.min(1, m.t / 0.3, (D - m.t) / 0.5);
      ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const y = H * 0.36;
      ctx.fillStyle = 'rgba(10,8,25,0.6)'; ctx.fillRect(0, y - 30, W, 58);
      ctx.font = `${Math.round(11 * clamp(scene.unit(), 0.9, 1.4))}px Nunito, sans-serif`;
      ctx.fillStyle = '#c9bfe8'; ctx.fillText(`REGIÃO ${m.idx + 1} DE ${ZONES.length}`, W / 2, y - 12);
      ctx.font = `${Math.round(20 * clamp(scene.unit(), 0.9, 1.5))}px Bungee, Impact, sans-serif`;
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,10,30,0.9)'; ctx.strokeText(m.name, W / 2, y + 10);
      ctx.fillStyle = '#ffd977'; ctx.fillText(m.name, W / 2, y + 10);
      ctx.globalAlpha = 1;
    }
  }
  if (moment.boss) {
    const m = moment.boss; m.t += dt;
    const D = 1.7;
    if (m.t > D) moment.boss = null;
    else {
      const slide = low ? 0 : Math.max(0, 1 - m.t / 0.25);
      const a = Math.min(1, (D - m.t) / 0.4);
      const y = H * 0.5;
      ctx.globalAlpha = a;
      ctx.fillStyle = m.ancient ? 'rgba(60,20,110,0.75)' : 'rgba(110,10,30,0.72)';
      ctx.fillRect(-slide * W, y - 26, W, 52);
      ctx.fillStyle = m.ancient ? '#c58bff' : '#ff5d6c'; ctx.fillRect(-slide * W, y - 26, W, 3); ctx.fillRect(slide * W, y + 23, W, 3);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `${Math.round(22 * clamp(scene.unit(), 0.9, 1.5))}px Bungee, Impact, sans-serif`;
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(20,5,15,0.9)';
      const txt = m.ancient ? 'CHEFE ANCESTRAL' : 'CHEFE';
      ctx.strokeText(txt, W / 2 + slide * W, y - 4); ctx.fillStyle = '#fff'; ctx.fillText(txt, W / 2 + slide * W, y - 4);
      ctx.font = `${Math.round(11 * clamp(scene.unit(), 0.9, 1.4))}px Nunito, sans-serif`;
      ctx.fillStyle = '#ffd6dc'; ctx.fillText(`${Math.round(bossTime())} s para derrotá-lo`, W / 2 - slide * W, y + 15);
      ctx.globalAlpha = 1;
    }
  }
  if (foe && foe.boss && !foe.dead) {           // borda pulsante enquanto o chefe vive (mais forte no fim do tempo)
    const urgent = foe.timer < 5;
    const p = low ? 0.5 : (Math.sin(performance.now() / (urgent ? 120 : 400)) + 1) / 2;
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45, W / 2, H / 2, Math.max(W, H) * 0.75);
    const c = foe.ancient ? '120,60,220' : '200,20,50';
    g.addColorStop(0, `rgba(${c},0)`); g.addColorStop(1, `rgba(${c},${(urgent ? 0.35 : 0.16) + p * 0.12})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
}

/* ---------- efeitos com hierarquia: anel (crítico/derrota), coluna de luz (lendário/mítico) ---------- */
const rings = [], beams = [];
function drawRingsBeams(dt) {
  for (let i = rings.length - 1; i >= 0; i--) {
    const g = rings[i]; g.t += dt;
    if (g.t > g.life) { rings.splice(i, 1); continue; }
    const k = g.t / g.life;
    ctx.globalAlpha = 1 - k; ctx.strokeStyle = g.color; ctx.lineWidth = g.w * (1 - k) + 1;
    ctx.beginPath(); ctx.arc(g.x, g.y, g.r0 + (g.r1 - g.r0) * (1 - (1 - k) * (1 - k)), 0, Math.PI * 2); ctx.stroke();
    if (g.runes) {
      const rr = g.r0 + (g.r1 - g.r0) * k;
      ctx.fillStyle = g.color;
      for (let j = 0; j < 8; j++) { const an = j / 8 * Math.PI * 2 + k * 2; const x = g.x + Math.cos(an) * rr, y = g.y + Math.sin(an) * rr; ctx.fillRect(x - 2, y - 5, 4, 10); ctx.fillRect(x - 5, y - 1, 10, 2); }
    }
  }
  for (let i = beams.length - 1; i >= 0; i--) {
    const bm = beams[i]; bm.t += dt;
    if (bm.t > 1.6) { beams.splice(i, 1); continue; }
    const a = Math.min(1, bm.t / 0.15) * Math.max(0, 1 - (bm.t - 0.8) / 0.8);
    const w = 36 + Math.sin(bm.t * 20) * 4;
    const g = ctx.createLinearGradient(bm.x - w, 0, bm.x + w, 0);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, bm.color); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.globalAlpha = a * 0.8; ctx.fillStyle = g; ctx.fillRect(bm.x - w, 0, w * 2, bm.y);
    ctx.globalAlpha = a; ctx.fillStyle = '#fff'; ctx.fillRect(bm.x - 2, 0, 4, bm.y);
  }
  ctx.globalAlpha = 1;
}

/* ---------- efeitos ---------- */
const parts = [], nums = [], slashes = [], projs = [], bolts = [];
let shakeT = 0, shakeA = 0, flashT = 0, flashCol = 'rgba(220,245,255,A)';
const reducedMotionOS = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const motionLow = () => reducedMotionOS || S.settings.reduceMotion;
const fx = {
  number(amount, x, y, kind) {
    if (nums.length > 30) nums.shift();
    nums.push({ txt: fmt(amount), x: x + (Math.random() - 0.5) * 30, y, t: 0, kind });
  },
  slash(x, y, crit) {
    if (slashes.length > 12) slashes.shift();
    slashes.push({ x, y, a: Math.random() * Math.PI, t: 0, crit });
    if (S.settings.particles) for (let i = 0; i < (crit ? 10 : 4); i++) this.spark(x, y, crit ? '#ffe37a' : '#ffffff');
  },
  spark(x, y, color, speed = 1) {
    if (!S.settings.particles || parts.length > 260) return;
    const a = Math.random() * Math.PI * 2, v = (60 + Math.random() * 180) * speed;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, t: 0, life: 0.35 + Math.random() * 0.3, color, size: 2 + Math.random() * 3, g: 380 });
  },
  coinBurst(n) {
    const c = scene.monster();
    for (let i = 0; i < n; i++) {
      parts.push({ x: c.x, y: c.y, vx: (Math.random() - 0.5) * 260, vy: -160 - Math.random() * 220, t: 0, life: 0.9, color: '#ffc94a', size: 5, g: 600, coin: true });
    }
  },
  dieBurst() {
    if (!foe) return;
    const c = scene.monster();
    for (let i = 0; i < 24; i++) this.spark(c.x + (Math.random() - 0.5) * c.r, c.y + (Math.random() - 0.5) * c.r, `hsl(${foe.hue},70%,60%)`, 1.4);
  },
  ring(x, y, r0, r1, color, life = 0.45, w = 5, runes = false) { if (rings.length < 12) rings.push({ x, y, r0, r1, color, life, w, runes, t: 0 }); },
  beam(x, y, color) { if (beams.length < 3) beams.push({ x, y, color, t: 0 }); },
  flash(col, a) { if (motionLow()) return; flashCol = col; flashT = Math.max(flashT, a); },
  shake(a) { if (!S.settings.shake || motionLow()) return; shakeT = 0.25; shakeA = Math.max(shakeA, a); },
  lightning() {
    const c = scene.monster();
    const pts = []; let x = c.x + (Math.random() - 0.5) * 40, y = -10;
    while (y < c.y) { pts.push([x, y]); y += 20 + Math.random() * 25; x += (Math.random() - 0.5) * 50; }
    pts.push([c.x, c.y]);
    bolts.push({ pts, t: 0 });
    flashT = 0.25; flashCol = 'rgba(220,245,255,A)';
  },
};

/* ---------- desenho ---------- */
function drawMonster(m, t) {
  const c = scene.monster();
  let { x, y, r } = c;
  const born = clamp(m.born / 0.25, 0, 1);
  let sx = 1, sy = 1 + Math.sin(t * 3) * 0.03;
  if (m.hit > 0) { sx = 1.08; sy = 0.92; x += 6; }
  let alpha = 1;
  if (m.dead) { const k = clamp(m.deathT / 0.35, 0, 1); sx *= 1 + k * 0.3; sy *= 1 - k * 0.6; alpha = 1 - k; }
  const scale = 0.4 + 0.6 * born;
  if (!motionLow()) y -= (1 - born) * (1 - born) * r * (m.boss ? 2.2 : 1.2);   // cai do alto ao entrar
  if (m.ancient && !m.dead) {
    ctx.save(); ctx.translate(c.x, scene.ground() - 2); ctx.scale(1, 0.32); ctx.rotate(motionLow() ? 0 : t * 0.6);
    ctx.strokeStyle = `rgba(197,139,255,${0.55 * born})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, r * 1.25, 0, Math.PI * 2); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, r * 1.05, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = `rgba(230,200,255,${0.8 * born})`;
    for (let j = 0; j < 12; j++) { ctx.rotate(Math.PI / 6); ctx.fillRect(r * 1.1, -2, 10, 4); ctx.fillRect(r * 1.13, -7, 3, 14); }
    ctx.restore();
  }
  if (m.chest && !m.dead) {
    const g = ctx.createRadialGradient(c.x, c.y, r * 0.2, c.x, c.y, r * 1.6);
    g.addColorStop(0, `rgba(255,214,90,${0.35 + Math.sin(t * 5) * 0.1})`); g.addColorStop(1, 'rgba(255,214,90,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c.x, c.y, r * 1.6, 0, Math.PI * 2); ctx.fill();
    if (S.settings.particles && Math.random() < 0.15) parts.push({ x: c.x + (Math.random() - 0.5) * r * 1.4, y: c.y - r * 0.6, vx: 0, vy: -40, t: 0, life: 0.7, color: '#ffe08a', size: 3, g: 0 });
  }
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath(); ctx.ellipse(c.x, scene.ground() + 2, r * 0.9 * scale, r * 0.16 * scale, 0, 0, Math.PI * 2); ctx.fill();
  ctx.translate(x, y + r * 0.78);
  ctx.scale(sx * scale, sy * scale);
  ctx.translate(0, -r * 0.78);

  if (m.chest) { drawChest(m, r, t); ctx.restore(); return; }

  const light = `hsl(${m.hue},${m.sat}%,64%)`, dark = `hsl(${m.hue},${m.sat}%,30%)`;
  if (m.boss) {
    ctx.save();
    ctx.globalAlpha = alpha * (0.35 + Math.sin(t * 4) * 0.1);
    const ag = ctx.createRadialGradient(0, 0, r * 0.5, 0, 0, r * 1.5);
    const ac = m.ancient ? '197,139,255' : '255,60,90';
    ag.addColorStop(0, `rgba(${ac},0.8)`); ag.addColorStop(1, `rgba(${ac},0)`);
    ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(0, 0, r * 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = dark;
  ctx.beginPath(); ctx.ellipse(-r * 0.4, r * 0.72, r * 0.22, r * 0.12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(r * 0.4, r * 0.72, r * 0.22, r * 0.12, 0, 0, Math.PI * 2); ctx.fill();
  if (m.horns) {
    ctx.fillStyle = m.boss ? '#3a1a22' : '#f1e6c8';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(s * r * 0.35, -r * 0.7);
      ctx.quadraticCurveTo(s * r * 0.9, -r * (0.9 + m.hornLen), s * r * (0.55 + m.hornLen * 0.6), -r * (1.1 + m.hornLen));
      ctx.quadraticCurveTo(s * r * 0.55, -r * 0.95, s * r * 0.6, -r * 0.55);
      ctx.closePath(); ctx.fill();
    }
  }
  const body = new Path2D();
  const N = 48;
  for (let i = 0; i <= N; i++) {
    const a = (i / N) * Math.PI * 2;
    const rr = r * (1 + m.amp * Math.sin(m.lobes * a + m.phase + t * 0.8));
    let px = Math.cos(a) * rr, py = Math.sin(a) * rr * 0.92;
    if (py > r * 0.7) py = r * 0.7 + (py - r * 0.7) * 0.25;
    if (i === 0) body.moveTo(px, py); else body.lineTo(px, py);
  }
  body.closePath();
  const bg = ctx.createRadialGradient(-r * 0.3, -r * 0.4, r * 0.1, 0, 0, r * 1.1);
  bg.addColorStop(0, light); bg.addColorStop(1, dark);
  ctx.fillStyle = bg; ctx.fill(body);
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.stroke(body);
  if (m.shiny) { ctx.lineWidth = 3; ctx.strokeStyle = `hsl(${(t * 120) % 360},90%,75%)`; ctx.stroke(body); if (S.settings.particles && Math.random() < 0.2) fx.spark(x + (Math.random() - 0.5) * r, y - r * 0.5, '#fff3a8', 0.4); }
  if (m.spikes) {
    ctx.fillStyle = dark;
    for (let i = -2; i <= 2; i++) {
      const a = -Math.PI / 2 + i * 0.35;
      const bx = Math.cos(a) * r * 0.92, by = Math.sin(a) * r * 0.86;
      ctx.beginPath();
      ctx.moveTo(bx - 8, by + 4); ctx.lineTo(bx + Math.cos(a) * r * 0.22, by + Math.sin(a) * r * 0.22); ctx.lineTo(bx + 8, by + 4);
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.fillStyle = `hsla(${m.hue},${m.sat}%,82%,0.35)`;
  ctx.beginPath(); ctx.ellipse(0, r * 0.3, r * 0.5, r * 0.32, 0, 0, Math.PI * 2); ctx.fill();
  const ey = -r * 0.25;
  const spread = m.eyes === 1 ? [0] : m.eyes === 2 ? [-0.3, 0.3] : [-0.4, 0, 0.4];
  const er = r * (m.eyes === 1 ? 0.26 : m.eyes === 2 ? 0.18 : 0.14);
  const blink = (Math.sin(t * 1.3 + m.phase * 5) > 0.985) ? 0.15 : 1;
  for (const s of spread) {
    const yy = ey - (s === 0 && m.eyes === 3 ? r * 0.12 : 0);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(s * r, yy, er, er * blink, 0, 0, Math.PI * 2); ctx.fill();
    if (blink === 1) {
      ctx.fillStyle = m.boss ? '#c3102e' : '#1a1030';
      ctx.beginPath(); ctx.arc(s * r - er * 0.35, yy + er * 0.1, er * 0.5, 0, Math.PI * 2); ctx.fill();
    }
  }
  if (m.boss) {
    ctx.strokeStyle = '#1a1030'; ctx.lineWidth = 4;
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(s * r * 0.55, ey - er * 1.6); ctx.lineTo(s * r * 0.12, ey - er * 0.9); ctx.stroke(); }
  }
  ctx.fillStyle = '#2a0d1a';
  ctx.beginPath(); ctx.ellipse(0, r * 0.2, r * 0.32, r * (m.hit > 0 ? 0.2 : 0.12), 0, 0, Math.PI); ctx.fill();
  ctx.fillStyle = '#fff';
  for (const s of [-0.18, 0.18]) { ctx.beginPath(); ctx.moveTo(s * r - 5, r * 0.2); ctx.lineTo(s * r, r * 0.3); ctx.lineTo(s * r + 5, r * 0.2); ctx.fill(); }
  if (m.boss) {
    ctx.fillStyle = '#ffc94a'; ctx.strokeStyle = '#8a5a10'; ctx.lineWidth = 2;
    ctx.beginPath();
    const cw = r * 0.5, cy = -r * 0.92;
    ctx.moveTo(-cw, cy); ctx.lineTo(-cw, cy - r * 0.25); ctx.lineTo(-cw * 0.5, cy - r * 0.1); ctx.lineTo(0, cy - r * 0.32);
    ctx.lineTo(cw * 0.5, cy - r * 0.1); ctx.lineTo(cw, cy - r * 0.25); ctx.lineTo(cw, cy); ctx.closePath();
    ctx.fill(); ctx.stroke();
  }
  if (m.hit > 0) { ctx.fillStyle = `rgba(255,255,255,${m.hit * 4})`; ctx.fill(body); }
  ctx.restore();
}

function drawChest(m, r, t) {
  const w = r * 1.5, h = r * 1.1, open = Math.sin(t * 6) * 0.08 + 0.15;
  ctx.fillStyle = '#7a4a22'; ctx.strokeStyle = '#3a210c'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.rect(-w / 2, -h * 0.2, w, h * 0.85); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.translate(-w / 2, -h * 0.2); ctx.rotate(-open);
  ctx.fillStyle = '#8f5a2a'; ctx.beginPath(); ctx.rect(0, -h * 0.4, w, h * 0.4); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffc94a'; ctx.fillRect(0, -h * 0.08, w, h * 0.08);
  ctx.restore();
  ctx.fillStyle = '#2a0d1a'; ctx.fillRect(-w / 2 + 6, -h * 0.22, w - 12, 8);
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 6; i++) { const x = -w / 2 + 12 + i * (w - 24) / 5; ctx.beginPath(); ctx.moveTo(x - 6, -h * 0.2); ctx.lineTo(x, -h * 0.08); ctx.lineTo(x + 6, -h * 0.2); ctx.fill(); }
  ctx.fillStyle = '#ffc94a'; ctx.fillRect(-w / 2, h * 0.2, w, h * 0.08);
  ctx.beginPath(); ctx.arc(0, h * 0.24, r * 0.14, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ff3b5c'; ctx.beginPath(); ctx.arc(-r * 0.25, -h * 0.32 - open * 30, 6, 0, Math.PI * 2); ctx.arc(r * 0.25, -h * 0.32 - open * 30, 6, 0, Math.PI * 2); ctx.fill();
  if (m.hit > 0) { ctx.fillStyle = `rgba(255,255,255,${m.hit * 3})`; ctx.fillRect(-w / 2, -h * 0.6, w, h * 1.25); }
}

// Desenha o herói na origem (pés em y = 0, unidades do herói). eq = equipamentos que definem a skin.
function drawHeroFigure(c, t, atkK, fury, eq, raise = 0) {
  const bob = Math.sin(t * 4) * 2;
  const A = eq.armor, Hh = eq.hat, Sw = eq.sword, Rg = eq.ring;
  const rcol = it => RARITIES[it.rar].color;
  const body = A ? `hsl(${A.hue},55%,${A.model === 1 || A.model === 3 ? 55 : 46}%)` : '#3f6fd1';
  const bodyDark = A ? `hsl(${A.hue},45%,28%)` : '#2a4a9a';
  const trim = A ? rcol(A) : '#ffc94a';
  const cape = A ? `hsl(${(A.hue + 180) % 360},45%,32%)` : '#7a2a8a';
  c.fillStyle = 'rgba(0,0,0,0.28)';
  c.beginPath(); c.ellipse(0, 2, 30, 6, 0, 0, Math.PI * 2); c.fill();
  if (fury) {
    c.fillStyle = `rgba(255,90,60,${0.25 + Math.sin(t * 12) * 0.1})`;
    c.beginPath(); c.ellipse(0, -45, 42, 56, 0, 0, Math.PI * 2); c.fill();
  }
  // capa
  c.fillStyle = cape;
  c.beginPath(); c.moveTo(-8, -70 + bob); c.quadraticCurveTo(-34 - Math.sin(t * 5) * 4, -40, -26, A && A.model === 2 ? -2 : -6); c.lineTo(4, -12); c.closePath(); c.fill();

  // combo
  if (combo.n >= 5 && combo.t < 0.6) {
    const hp = scene.heroPos();
    ctx.font = `${Math.round(15 * clamp(scene.unit(), 0.8, 1.4))}px Bungee, Impact, sans-serif`;
    ctx.globalAlpha = 1 - combo.t / 0.6 * 0.6;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,10,30,0.85)';
    const txt = `COMBO ${combo.n}  +${Math.round((comboMult() - 1) * 100)}%`;
    const y = hp.y - 95 * scene.unit();
    ctx.strokeText(txt, W * 0.5, Math.max(y, 80));
    ctx.fillStyle = combo.n >= 100 ? '#ff8a5a' : '#ffd84a';
    ctx.fillText(txt, W * 0.5, Math.max(y, 80));
    ctx.globalAlpha = 1;
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawMoments(dt);
  if (flashT > 0 && !motionLow()) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = flashCol.replace('A', flashT); ctx.fillRect(0, 0, cv.width, cv.height); }
  if (skillActive(2)) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = 'rgba(255,201,74,0.6)';
    for (let i = 0; i < 10; i++) { const x = (i * 131 + t * 40) % W, y = (t * 120 + i * 77) % H; ctx.fillRect(x, y, 3, 6); }
  }
}

function bestAlly() {
  let best = -1, bestV = 0;
  const highest = highestAlly();
  for (let i = 0; i <= Math.min(highest + 1, ALLIES.length - 1); i++) {
    const l = S.allies[i], n = qtyFor(ALLIES[i].cost, ALLY_G, l);
    const gain = allyDps(i, l + n) - allyDps(i, l);
    const v = gain / allyCost(i, n);
    if (v > bestV) { bestV = v; best = i; }
  }
  return best;
}

function tabBadges() {
  const can = {
    heroi: S.gold >= heroCost(1),
    aliados: ALLIES.some((A, i) => i <= highestAlly() + 1 && S.gold >= allyCost(i, 1)),
    habilidades: SKILLS.some((sk, i) => S.hero >= sk.unlock && S.skills[i].lvl < SKILL_MAX && S.gold >= skillCost(i)),
    itens: S.inv.some(it => itemCompare(it).ratio > 1.0001),
    reliquias: essGain() > 0 || ARTIFACTS.some(a => !(a.max && art(a.id) >= a.max) && S.ess >= artCost(a)),
    conquistas: dailyState().available || QKEYS.some(k => !S.quests[k].done && S.quests[k].prog >= S.quests[k].goal) || (!S.quests.bonus && QKEYS.every(k => S.quests[k].done)) || ACH.some(a => { const t = S.ach[a.id] || 0; return t < a.goals.length && a.get() >= a.goals[t]; }),
  };
  document.querySelectorAll('#tabs [data-tab]').forEach(b => b.classList.toggle('has', !!can[b.dataset.tab]));
}

function toast(msg, kind = '') {

  t.className = 'toast ' + kind; t.textContent = msg;

let modalLocked = false;
function openModal(html, onMount, opts) {

function closeModal(force) {

const esc = v => String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function fmtDate(ms) {
  if (!(ms > 0)) return '—';
  try { return new Date(ms).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }); } catch (e) { return new Date(ms).toISOString(); }
}
function summaryCard(title, x) {
  return `<div class="card sumCard"><h3 class="gold">${esc(title)}</h3><dl class="stats">
    <dt>Estágio atual / máximo</dt><dd>${fmt(x.stage)} / ${fmt(x.maxStage)}</dd>

    <dt>Essências (total ganho)</dt><dd>${fmt(x.ess)} (${fmt(x.essTotal)})</dd>
    <dt>Aliados · itens</dt><dd>${x.allies} · ${x.items}</dd>

}
function downloadText(name, text) {
  try {
    const url = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  } catch (e) { return false; }
}
// Todos os dados brutos do jogo neste navegador, como estão (inclusive os ilegíveis), para guardar ou pedir ajuda.
function rawDump() {
  const out = { exportedAt: new Date().toISOString(), game: 'Lâmina Rúnica', saveVersion: VERSION, keys: {} };
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('laminaRunica.')) out.keys[k] = localStorage.getItem(k);
    }
  } catch (e) {}
  return JSON.stringify(out, null, 1);
}
function stamp() { const d = new Date(); return `${todayKey(d)}_${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}`; }

const SOURCE_NAME = { backup: 'Backup recente', snap0: 'Cópia rotativa 1', snap1: 'Cópia rotativa 2', snap2: 'Cópia rotativa 3' };
function openRecovery(info) {
  saveBlock = 'recover';
  const why = info.mainError === 'missing'
    ? 'O salvamento principal não foi encontrado, mas existem cópias de segurança neste navegador.'
    : `O salvamento principal não pôde ser lido (${esc(SAVE_ERRORS[info.mainError] || info.mainError)}). Ele <b>não foi apagado</b>.`;
  const list = info.candidates.map((c, i) => `${summaryCard(SOURCE_NAME[c.source] || c.source, saveSummary(c.res.state))}
      <div class="btns"><button class="btn primary" data-cand="${i}">Carregar esta cópia</button></div>`).join('');
  openModal(`<h2>Recuperar progresso</h2>
    <p>${why} Nada será gravado até você escolher uma opção.</p>
    ${info.candidates.length ? list : '<p><b>Nenhuma cópia legível foi encontrada.</b> Exporte os dados brutos para guardar o que existe.</p>'}
    <div class="btns"><button class="btn" id="dumpBtn">Exportar dados brutos (.txt)</button></div>
    <div class="sectionLabel">Última opção</div>
    <div class="btns"><button class="btn danger" id="newGame">Começar um novo jogo</button></div>
    <p class="muted">Começar de novo guarda uma cópia do salvamento ilegível neste navegador; ela continua disponível em “Exportar dados brutos”.</p>`,
    sh => {
      sh.querySelectorAll('[data-cand]').forEach(b => b.addEventListener('click', () => {
        const c = info.candidates[+b.dataset.cand];
        if (info.mainText && Store.get(CORRUPT_KEY) !== info.mainText) Store.set(CORRUPT_KEY, info.mainText);
        Session.knownRev = Math.max(Session.knownRev, c.res.meta.rev || 0);
        saveBlock = '';
        forceClose();
        applyState(c.res.state, { snapshot: true });
        toast('Cópia carregada. O progresso voltou a ser salvo.', 'gold');
      }));
      sh.querySelector('#dumpBtn').addEventListener('click', () => {
        if (!downloadText(`lamina-runica-dados-${stamp()}.txt`, rawDump())) toast('O navegador bloqueou o download.', 'bad');
      });
      const nb = sh.querySelector('#newGame');
      nb.addEventListener('click', () => {
        if (!nb.classList.contains('armed')) { nb.classList.add('armed'); nb.textContent = 'Toque de novo para confirmar o novo jogo'; return; }
        if (info.mainText && Store.get(CORRUPT_KEY) !== info.mainText) Store.set(CORRUPT_KEY, info.mainText);
        if (info.candidates[0]) writeSafety('recover', info.candidates[0].text);
        saveBlock = '';
        forceClose();
        applyState(defaults(), {});
        toast('Novo jogo iniciado. As cópias anteriores continuam em “Exportar dados brutos”.');
      });
    }, { locked: true });
}

/* ---------- importação (em memória → resumo → confirmação → cópia de segurança → aplica tudo ou nada) ---------- */
function tryImport(text) {
  const r = importCodeChecked(text);
  if (!r.ok) { toast(IMPORT_ERRORS[r.error] || 'Código inválido.', 'bad'); return; }
  const s = r.state;
  openModal(`<h2>Carregar este progresso?</h2>
    <p>O progresso atual será substituído. Antes disso, uma cópia dele fica guardada e pode ser restaurada nas Configurações.</p>
    ${summaryCard('Progresso atual', saveSummary(S))}${summaryCard('Código importado', saveSummary(s))}
    ${r.fixes.length ? `<p class="muted">Alguns valores fora do intervalo permitido foram ajustados (${esc(r.fixes.join(', '))}).</p>` : ''}
    <div class="btns"><button class="btn primary" id="okImp">Carregar</button><button class="btn" data-close>Cancelar</button></div>`,
    sh => {
      const ok = sh.querySelector('#okImp');
      ok.addEventListener('click', () => {
        if (ok.disabled) return; ok.disabled = true;             // clique duplo não importa duas vezes
        if (Store.backend && !writeSafety('import', serialize())) { toast('Não foi possível guardar a cópia do progresso atual. Importação cancelada.', 'bad'); ok.disabled = false; return; }
        const prev = S;
        if (!applyState(s, { snapshot: true }) && Store.backend) {
          applyState(prev, {});                                  // tudo ou nada
          toast('Não foi possível gravar o progresso importado. Nada foi alterado.', 'bad');
          closeModal(); return;
        }
        cloudSave(); closeModal();
        toast('Progresso carregado!', 'gold');
      });
    });
}
function restoreSafety(reason, label) {
  const o = readSafety(reason);
  const r = o ? decodeSave(o.save) : null;
  if (!r || !r.ok) { toast('Essa cópia não está legível.', 'bad'); return; }
  openModal(`<h2>Restaurar ${esc(label)}?</h2>
    <p>Cópia guardada em ${esc(fmtDate(o.at))}. O progresso atual também fica guardado, então a troca pode ser desfeita.</p>
    ${summaryCard('Progresso atual', saveSummary(S))}${summaryCard('Cópia guardada', saveSummary(r.state))}
    <div class="btns"><button class="btn primary" id="okRes">Restaurar</button><button class="btn" data-close>Cancelar</button></div>`,
    sh => {
      const ok = sh.querySelector('#okRes');
      ok.addEventListener('click', () => {
        if (ok.disabled) return; ok.disabled = true;
        const cur = serialize();
        applyState(r.state, { snapshot: true });
        writeSafety(reason, cur);
        cloudSave(); closeModal(); toast('Cópia restaurada.', 'gold');
      });
    });
}
